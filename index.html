function studentActivityHtml(me) {
  const rows = S.data.log.filter((e) => e.studentId === me.id);
  const got = rows.filter((e) => e.amount > 0).reduce((a, e) => a + e.amount, 0);
  const spent = rows.filter((e) => e.amount < 0).reduce((a, e) => a + e.amount, 0);
  const kind = S.studentActivityKind || "all";
  let html = '<div class="grid gap-3 mb-4" style="grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));">' +
    '<div class="bs-card bs-card-pad"><div style="font-size:13px;color:var(--dim);">받은 합계</div><div class="bs-num" style="font-size:22px;font-weight:800;margin-top:4px;">+' + fmt(got) + '</div></div>' +
    '<div class="bs-card bs-card-pad"><div style="font-size:13px;color:var(--dim);">쓴 합계</div><div class="bs-num" style="font-size:22px;font-weight:800;margin-top:4px;color:var(--red);">' + fmt(spent) + '</div></div>' +
  '</div>';
  html += '<div class="flex gap-2 mb-4 flex-wrap" id="stuact-kinds">' +
    ["all"].concat(KINDS).map((k) => '<button type="button" class="bs-chip" data-stuact-kind="' + k + '" data-on="' + (kind === k) + '">' + (k === "all" ? "전체" : k) + '</button>').join("") +
  '</div>';
  html += '<div id="stuact-list">' + studentActivityListHtml(me) + '</div>';
  return html;
}

   교사 화면 — 전체 뼈대(상단바 + 사이드바 + 본문)
   ══════════════════════════════════════════════════════════ */
const NAV = [
  { k: "home", ico: "⌂", label: "학급 홈" },
  { k: "activity", ico: "▤", label: "활동 기록" },
  { group: "경제", ico: "◍", items: [
    { k: "store", ico: "▦", label: "상점" },
    { k: "finance", ico: "▣", label: "재테크" },
    { k: "stocks", ico: "◈", label: "주식" },
    { k: "jobs", ico: "▧", label: "직업 관리" },
  ] },
  { k: "quests", ico: "❏", label: "퀘스트" },
  { k: "tt", ico: "▥", label: "시간표" },
  { k: "settings", ico: "⚙", label: "설정" },
];

function pageBody() {
  switch (S.page) {
    case "home": return renderHomePage();
    case "activity": return renderActivityPage();
    case "store": return renderStorePage();
    case "finance": return renderFinancePage();
    case "stocks": return renderStocksPage();
    case "jobs": return renderJobsPage();
    case "quests": return renderQuestsPage();
    case "tt": return timetableHtml(false);
    case "settings": return renderSettingsPage();
    default: return "";
  }
}

function teacherAppHtml() {
  const d = S.data;
  const pending = d.requests.filter((r) => r.status === "대기").length;
  let navHtml = "";
  NAV.forEach((n) => {
    if (n.group) {
      navHtml += '<div><button type="button" class="bs-group" id="nav-eco-toggle">' +
        '<span class="bs-nav-ico">' + n.ico + '</span><span class="bs-lbl">' + n.group + '</span>' +
        '<span class="bs-caret" style="margin-left:auto;color:var(--mute);font-size:11px;">' + (S.ecoOpen ? "▾" : "▸") + '</span></button>';
      if (S.ecoOpen) {
        n.items.forEach((i) => {
          navHtml += '<button type="button" class="bs-sub" data-nav="' + i.k + '" data-on="' + (S.page === i.k) + '">' +
            '<span class="bs-nav-ico">' + i.ico + '</span><span class="bs-lbl">' + i.label + '</span></button>';
        });
      }
      navHtml += '</div>';
    } else {
      const badge = n.k === "home" ? pending : 0;
      navHtml += '<button type="button" data-nav="' + n.k + '" data-on="' + (S.page === n.k) + '">' +
        '<span class="bs-nav-ico">' + n.ico + '</span><span class="bs-lbl">' + n.label + '</span>' +
        (badge ? '<span class="bs-badge-n">' + badge + '</span>' : '') + '</button>';
    }
  });

  return '<div class="bs">' +
    '<div class="bs-top"><div class="mx-auto px-5 py-3 flex items-center justify-between gap-4" style="max-width:1240px;">' +
      '<div class="bs-mark">Choi<span>\'s</span></div>' +
      '<div class="flex items-center gap-2">' +
        '<span class="bs-pill" style="cursor:default;">' + escapeHtml(d.className) + '</span>' +
        '<button type="button" class="bs-pill" id="go-student">학생 모드</button>' +
      '</div></div></div>' +
    '<div class="bs-shell mx-auto flex gap-7 px-5 py-7" style="max-width:1240px;">' +
      '<aside class="bs-side"><nav class="bs-nav">' + navHtml + '</nav></aside>' +
      '<main style="flex:1;min-width:0;" id="main-content">' + pageBody() + '</main>' +
    '</div>' +
    '<div id="dock-wrap">' + renderDock() + '</div>' +
  '</div>';
}

/* ══════════════════════════════════════════════════════════
   최상위 렌더 + 이벤트 위임(한 번만 등록)
   ══════════════════════════════════════════════════════════ */
function render() {
  const root = document.getElementById("root");
  if (!S.ready || !S.data) {
    root.innerHTML = '<div class="bs" style="display:grid;place-items:center;padding:48px;"><p style="color:var(--dim);">불러오는 중…</p></div>';
    return;
  }
  if (S.mode === "student") { root.innerHTML = studentAppHtml(); return; }
  root.innerHTML = teacherAppHtml();
}

function bindGlobalEvents() {
  const root = document.getElementById("root");

  root.addEventListener("click", (e) => {
    /* 버튼 안의 아이콘/문구 span을 클릭해도 항상 버튼(또는 상호작용 요소) 자체를 대상으로 삼는다 */
    const t = e.target.closest("button, select, input, label") || e.target;

    /* ── 학생 모드 전환 ── */
    if (t.id === "go-student") { S.mode = "student"; S.sel = []; S.meId = null; S.studentPage = "wallet"; render(); return; }
    /* 이름 목록 화면의 «선생님» → 번호 확인 후 교사 화면으로 */
    if (t.id === "stu-exit") { openUnlockModal(S.data.pin, () => { S.mode = "teacher"; render(); }); return; }
    /* 학생 화면의 «바꾸기» → 다른 학생으로 (번호 필요 없음) */
    if (t.id === "stu-switch") { S.meId = null; S.studentPage = "wallet"; render(); return; }
    if (t.getAttribute("data-pick")) { S.meId = t.getAttribute("data-pick"); S.studentPage = "wallet"; render(); return; }

    /* ── 학생 모드 내비게이션 ── */
    const stuPage = t.getAttribute("data-stupage");
    if (stuPage) { S.studentPage = stuPage; render(); return; }
    const stuActKind = t.getAttribute("data-stuact-kind");
    if (stuActKind) {
      S.studentActivityKind = stuActKind;
      $$("#stuact-kinds [data-stuact-kind]").forEach((b) => b.setAttribute("data-on", b.getAttribute("data-stuact-kind") === stuActKind));
      const me = S.data.students.find((s) => s.id === S.meId);
      $("#stuact-list").innerHTML = studentActivityListHtml(me);
      return;
    }
    if (t.id === "stu-bank-in" || t.id === "stu-bank-out") {
      const input = $("#stu-bank-amt");
      const amt = Math.max(0, Number(input.value) || 0);
      if (!amt) return;
      studentBank(t.id === "stu-bank-in" ? "in" : "out", amt);
      return;
    }
    const questAsk = t.getAttribute("data-quest-ask");
    if (questAsk) { studentAsk("퀘스트", questAsk, (S.data.quests.find((q) => q.id === questAsk) || {}).title || ""); return; }
    const storeBuy = t.getAttribute("data-store-buy");
    if (storeBuy) { studentBuyOrAsk(storeBuy); return; }
    const tradeBuy = t.getAttribute("data-trade-buy");
    if (tradeBuy) { openTradeModal(S.data.stocks.find((x) => x.id === tradeBuy), "buy"); return; }
    const tradeSell = t.getAttribute("data-trade-sell");
    if (tradeSell) { openTradeModal(S.data.stocks.find((x) => x.id === tradeSell), "sell"); return; }

    /* ── 교사 내비게이션 ── */
    const nav = t.getAttribute("data-nav");
    if (nav) { S.page = nav; S.sel = []; render(); return; }
    if (t.id === "nav-eco-toggle") { S.ecoOpen = !S.ecoOpen; render(); return; }

    /* ── 학급 홈 ── */
    if (t.id === "hp-draw") { const pool = S.sel.length ? S.data.students.filter((s) => S.sel.includes(s.id)) : S.data.students; if (pool.length) openDrawModal(pool); return; }
    if (t.id === "hp-manage") { openManageModal(); return; }
    if (t.id === "hp-add" || t.id === "hp-add-empty") { openAddStudentsModal(); return; }
    if (t.id === "hp-sel-all") { S.sel = S.data.students.map((s) => s.id); render(); return; }
    if (t.id === "hp-sel-none") { S.sel = []; render(); return; }
    const stuCard = t.closest && t.closest(".bs-stu[data-id]");
    if (stuCard && S.page === "home" && S.mode === "teacher") {
      const id = stuCard.getAttribute("data-id");
      S.sel = S.sel.includes(id) ? S.sel.filter((x) => x !== id) : [...S.sel, id];
      render(); return;
    }
    const reqOk = t.getAttribute("data-req-ok");
    if (reqOk) { resolveRequest(S.data.requests.find((r) => r.id === reqOk), true); return; }
    const reqNo = t.getAttribute("data-req-no");
    if (reqNo) { resolveRequest(S.data.requests.find((r) => r.id === reqNo), false); return; }

    /* ── 액션 독(빠른 지급/차감) ── */
    const amtChip = t.getAttribute("data-amt");
    if (amtChip) { S.amount = Number(amtChip); render(); return; }
    const reasonChip = t.getAttribute("data-reason");
    if (reasonChip) { S.reason = S.reason === reasonChip ? "" : reasonChip; render(); return; }
    if (t.id === "dock-give") { move(S.sel, S.amount, S.reason, "지급"); say(S.sel.length + "명에게 " + fmt(S.amount) + " 지급"); return; }
    if (t.id === "dock-take") { move(S.sel, -S.amount, S.reason, "차감"); say(S.sel.length + "명에게서 " + fmt(S.amount) + " 차감"); return; }
    if (t.id === "dock-clear") { S.sel = []; render(); return; }

    /* ── 활동 기록 ── */
    if (t.id === "act-export") { exportActivityCsv(); return; }
    const kindChip = t.getAttribute("data-kind");
    if (kindChip) { S.activityFilter.kind = kindChip; $$("#act-kinds [data-kind]").forEach((b) => b.setAttribute("data-on", b.getAttribute("data-kind") === kindChip)); $("#act-table").innerHTML = activityTableHtml(); return; }

    /* ── 상점 ── */
    if (t.id === "st-new" || t.id === "st-new2") { openItemModal(null); return; }
    if (t.id === "st-sample") { fillSampleItems(); return; }
    const buyId = t.getAttribute("data-buy");
    if (buyId) { openBuyModal(S.data.items.find((i) => i.id === buyId)); return; }
    const editItemId = t.getAttribute("data-edit-item");
    if (editItemId) { openItemModal(S.data.items.find((i) => i.id === editItemId)); return; }

    /* ── 재테크 ── */
    if (t.id === "fin-in") { openBankModal("in"); return; }
    if (t.id === "fin-out") { openBankModal("out"); return; }
    if (t.id === "fin-interest") { payInterest(); return; }

    /* ── 주식 ── */
    if (t.id === "stk-new" || t.id === "stk-new2") { openStockModal(null); return; }
    if (t.id === "stk-sample") { fillSampleStocks(); return; }
    if (t.id === "mk-toggle") { patch((d) => Object.assign({}, d, { market: Object.assign({}, d.market, { open: !d.market.open }) })); say(S.data.market.open ? "거래를 열었어요." : "거래를 마감했어요."); return; }
    if (t.id === "mk-batch") { openMarketModal(); return; }
    if (t.id === "mk-dividend") { openDividendModal(); return; }
    const stkPrice = t.getAttribute("data-stk-price");
    if (stkPrice) { openPriceModal(S.data.stocks.find((x) => x.id === stkPrice)); return; }
    const stkEdit = t.getAttribute("data-stk-edit");
    if (stkEdit) { openStockModal(S.data.stocks.find((x) => x.id === stkEdit)); return; }

    /* ── 직업 관리 ── */
    if (t.id === "job-new" || t.id === "job-new2") { openJobModal(null); return; }
    if (t.id === "job-sample") { fillSampleJobs(); return; }
    if (t.id === "job-payall") { paySalaries(); return; }
    const jobPay = t.getAttribute("data-job-pay");
    if (jobPay) { paySalaryOne(S.data.jobs.find((j) => j.id === jobPay)); return; }
    const jobAssign = t.getAttribute("data-job-assign");
    if (jobAssign) { openAssignModal(S.data.jobs.find((j) => j.id === jobAssign)); return; }
    const jobEdit = t.getAttribute("data-job-edit");
    if (jobEdit) { openJobModal(S.data.jobs.find((j) => j.id === jobEdit)); return; }

    /* ── 퀘스트 ── */
    if (t.id === "quest-new" || t.id === "quest-new2") { openQuestModal(null); return; }
    if (t.id === "quest-sample") { fillSampleQuests(); return; }
    const qf = t.getAttribute("data-filt");
    if (qf) { S.questFilter = qf; render(); return; }
    const qDone = t.getAttribute("data-quest-done");
    if (qDone) { openDoneModal(S.data.quests.find((q) => q.id === qDone)); return; }
    const qToggle = t.getAttribute("data-quest-toggle");
    if (qToggle) { patch((d) => Object.assign({}, d, { quests: d.quests.map((x) => (x.id === qToggle ? Object.assign({}, x, { open: !x.open }) : x)) })); return; }
    const qEdit = t.getAttribute("data-quest-edit");
    if (qEdit) { openQuestModal(S.data.quests.find((q) => q.id === qEdit)); return; }

    /* ── 시간표 ── */
    if (t.id === "tt-minus") { patch((d) => Object.assign({}, d, { timetable: Object.assign({}, d.timetable, { periods: d.timetable.periods - 1 }) })); return; }
    if (t.id === "tt-plus") { patch((d) => Object.assign({}, d, { timetable: Object.assign({}, d.timetable, { periods: d.timetable.periods + 1 }) })); return; }

    /* ── 설정 ── */
    if (t.id === "set-mode-instant") { patch((d) => Object.assign({}, d, { storeMode: "instant" })); return; }
    if (t.id === "set-mode-approval") { patch((d) => Object.assign({}, d, { storeMode: "approval" })); return; }
    if (t.id === "set-backup") { download(S.data.className + "-백업-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(S.data, null, 2)); return; }
    if (t.id === "set-reset-balance") { patch((d) => Object.assign({}, d, { students: d.students.map((s) => Object.assign({}, s, { balance: 0, savings: 0, holdings: {} })) })); say("잔액과 보유 주식을 초기화했어요."); return; }
    if (t.id === "set-reset-all") { openResetModal(); return; }
  });

  root.addEventListener("input", (e) => {
    const t = e.target;
    /* 학급 홈 독 - 금액/사유 직접입력 (조용히 반영, 다시그리기 없음) */
    if (t.id === "dock-amt-input") { S.amount = Math.max(0, Number(t.value) || 0); return; }
    if (t.id === "dock-reason-input") { S.reason = t.value; return; }

    /* 활동기록 검색(라이브 필터, 표만 갱신) */
    if (t.id === "act-q") { S.activityFilter.q = t.value; const el = document.getElementById("act-table"); if (el) el.innerHTML = activityTableHtml(); return; }

    /* 시간표 칸 (조용히 반영) */
    const ttKey = t.getAttribute("data-tt-cell");
    if (ttKey) { patchQuiet((d) => Object.assign({}, d, { timetable: Object.assign({}, d.timetable, { cells: Object.assign({}, d.timetable.cells, { [ttKey]: t.value }) }) })); return; }

    /* 설정 입력들 (조용히 반영) */
    if (t.id === "set-classname") { patchQuiet((d) => Object.assign({}, d, { className: t.value })); return; }
    if (t.id === "set-currency") { patchQuiet((d) => Object.assign({}, d, { currency: t.value })); return; }
    if (t.id === "set-pin") { t.value = t.value.replace(/\D/g, "").slice(0, 4); patchQuiet((d) => Object.assign({}, d, { pin: t.value })); return; }

    /* 재테크 이자율 (조용히 반영 + 큰 숫자만 즉시 갱신) */
    if (t.id === "fin-rate") {
      const v = Math.max(0, Math.min(100, Number(t.value)));
      patchQuiet((d) => Object.assign({}, d, { interestRate: v }));
      const disp = document.getElementById("fin-rate-display");
      if (disp) disp.textContent = v + "%";
      return;
    }

    /* 학생 모드 활동기록 검색 없음(필터만) */
  });

  root.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "act-who") { S.activityFilter.who = t.value; const el = document.getElementById("act-table"); if (el) el.innerHTML = activityTableHtml(); return; }
    if (t.id === "set-restore") {
      const f = t.files && t.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const parsed = JSON.parse(String(r.result));
          if (!parsed || !Array.isArray(parsed.students)) throw new Error("bad file");
          S.data = migrate(parsed);
          scheduleSave();
          render();
          say("백업을 복원했어요.");
        } catch (err) {
          say("읽을 수 없는 파일이에요. 이 도구에서 만든 백업인지 확인해 주세요.");
        }
      };
      r.readAsText(f);
      t.value = "";
      return;
    }
  });
}

/* ── 학생 모드 동작 함수들 ── */
/* 주식 매수/매도 실행 (검증 포함) */
function doTrade(stockId, side, qty) {
  const d = S.data;
  if (!d.market.open) { say("지금은 거래 시간이 아니에요."); return; }
  const me = d.students.find((s) => s.id === S.meId);
  const st = d.stocks.find((x) => x.id === stockId);
  if (!me || !st) { say("종목을 찾을 수 없어요."); return; }
  qty = Math.floor(Number(qty) || 0);
  if (qty <= 0) { say("주 수를 입력해 주세요."); return; }

  const buying = side === "buy";
  const total = st.price * qty;
  const have = sharesOf(me, stockId);

  if (buying) {
    if (st.price <= 0) { say("주가가 0원이라 살 수 없어요."); return; }
    if (me.balance < total) { say("지갑에 돈이 모자라요."); return; }
  } else {
    if (have < qty) { say("가진 주식보다 많이 팔 수 없어요."); return; }
  }

  const at = now();
  patch((dd) => {
    const students = dd.students.map((s) => {
      if (s.id !== me.id) return s;
      const holdings = Object.assign({}, s.holdings);
      const cur = holdings[stockId] || { shares: 0, avgCost: 0 };
      if (buying) {
        const newShares = cur.shares + qty;
        const newAvg = (cur.avgCost * cur.shares + total) / newShares;
        holdings[stockId] = { shares: newShares, avgCost: newAvg };
      } else {
        const left = cur.shares - qty;
        if (left > 0) holdings[stockId] = { shares: left, avgCost: cur.avgCost };
        else delete holdings[stockId];
      }
      return Object.assign({}, s, { balance: buying ? s.balance - total : s.balance + total, holdings });
    });
    const entry = { id: uid(), at, kind: "주식", studentId: me.id, studentName: me.name,
      amount: buying ? -total : total,
      reason: st.name + " " + fmt(qty) + "주 " + (buying ? "매수" : "매도") + " (1주 " + fmt(st.price) + ")" };
    return Object.assign({}, dd, { students, log: [entry, ...dd.log].slice(0, 3000) });
  });
  say(st.name + " " + fmt(qty) + "주를 " + (buying ? "샀어요." : "팔았어요."));
}

function studentAsk(type, refId, label) {
  patch((d) => Object.assign({}, d, { requests: [{ id: uid(), type, refId, studentId: S.meId, at: now(), status: "대기" }, ...d.requests].slice(0, 500) }));
  say(label + " 신청을 보냈어요.");
}
function studentBuyOrAsk(itemId) {
  const d = S.data;
  const me = d.students.find((s) => s.id === S.meId);
  const it = d.items.find((i) => i.id === itemId);
  if (!it || !me) return;
  const instant = d.storeMode !== "approval";
  if (!instant) { studentAsk("구매", it.id, it.name); return; }
  if (me.balance < it.price) { say("포인트가 부족해요."); return; }
  if (it.stock != null && it.stock <= 0) { say("품절된 아이템이에요."); return; }
  const at = now();
  patch((dd) => Object.assign({}, dd, {
    students: dd.students.map((s) => (s.id === me.id ? Object.assign({}, s, { balance: s.balance - it.price }) : s)),
    items: dd.items.map((x) => (x.id === it.id && x.stock != null ? Object.assign({}, x, { stock: Math.max(0, x.stock - 1) }) : x)),
    log: [{ id: uid(), at, kind: "구매", studentId: me.id, studentName: me.name, amount: -it.price, reason: it.name + " 구매" }, ...dd.log].slice(0, 3000),
  }));
  say(it.name + "을 구매했어요.");
}
function studentBank(dir, amt) {
  const d = S.data;
  const me = d.students.find((s) => s.id === S.meId);
  if (!me) return;
  const real = dir === "in" ? Math.min(amt, me.balance) : Math.min(amt, me.savings || 0);
  if (real <= 0) { say("옮길 금액이 없어요."); return; }
  const at = now();
  patch((dd) => Object.assign({}, dd, {
    students: dd.students.map((s) => s.id !== me.id ? s
      : dir === "in" ? Object.assign({}, s, { balance: s.balance - real, savings: (s.savings || 0) + real })
                     : Object.assign({}, s, { balance: s.balance + real, savings: (s.savings || 0) - real })),
    log: [{ id: uid(), at, kind: dir === "in" ? "입금" : "출금", studentId: me.id, studentName: me.name, amount: dir === "in" ? -real : real, reason: dir === "in" ? "예금 입금" : "예금 출금" }, ...dd.log].slice(0, 3000),
  }));
  say(dir === "in" ? fmt(real) + " 예금했어요." : fmt(real) + " 출금했어요.");
}

function paySalaries() {
  const d = S.data;
  let count = 0;
  d.jobs.forEach((j) => {
    const holders = j.holders.filter((id) => d.students.some((s) => s.id === id));
    if (holders.length && j.salary > 0) { move(holders, j.salary, "급여 · " + j.name, "급여"); count += holders.length; }
  });
  say(count ? count + "명에게 급여를 보냈어요." : "급여를 받을 사람이 없어요.");
}
function paySalaryOne(j) {
  const hs = j.holders.filter((id) => S.data.students.some((s) => s.id === id));
  if (!hs.length) { say("배정된 학생이 없어요."); return; }
  move(hs, j.salary, "급여 · " + j.name, "급여");
  say(j.name + " " + hs.length + "명에게 급여를 보냈어요.");
}
function payInterest() {
  const at = now();
  const entries = [];
  patch((d) => {
    const ss = d.students.map((s) => {
      const gain = Math.floor(((s.savings || 0) * (d.interestRate || 0)) / 100);
      if (gain <= 0) return s;
      entries.push({ id: uid(), at, kind: "이자", studentId: s.id, studentName: s.name, amount: gain, reason: "예금 이자 " + d.interestRate + "%" });
      return Object.assign({}, s, { savings: s.savings + gain });
    });
    return Object.assign({}, d, { students: ss, log: [...entries, ...d.log].slice(0, 3000) });
  });
  say(entries.length ? "예금에 이자를 지급했어요." : "이자를 받을 예금이 없어요.");
}

/* ══════════════════════════════════════════════════════════
   시작
   ══════════════════════════════════════════════════════════ */
async function boot() {
  bindGlobalEvents();
  render(); // 로딩 화면
  const loaded = await store.load();
  myStamp = loaded.stamp;
  S.data = migrate(loaded.data);
  S.ready = true;
  render();

  /* 공용 서버(Supabase) 모드일 때만: 다른 기기의 변경을 주기적으로 가져오기 */
  if (store.mode === "server") {
    setInterval(async () => {
      if (saveTimer) return; // 저장 중이면 건너뜀
      try {
        const s = await store.stamp();
        if (s && s !== myStamp) {
          const loaded2 = await store.load();
          if (loaded2.data) { myStamp = loaded2.stamp; S.data = migrate(loaded2.data); render(); }
        }
      } catch (e) { /* 네트워크 오류는 조용히 무시 */ }
    }, 5000);
  }
}

document.addEventListener("DOMContentLoaded", boot);
</script>
