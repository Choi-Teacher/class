<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Choi's · 학급 운영 도구</title>
<meta name="theme-color" content="#F7F7F8" />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
/* ══════════════════════════════════════════════════════════
   Choi's — 학급 운영 도구 (순수 HTML/CSS/JavaScript 버전)
   ══════════════════════════════════════════════════════════ */
/* ── 색상·간격 변수는 :root 에 두어야 body 직속으로 붙는 모달/토스트에도 적용됩니다 ── */
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --line:#EDEDEF; --ink:#191A1C; --dim:#8C8C93; --mute:#B4B4BA;
  --dark:#141416; --soft:#F0F0F2; --coin:#F5C33B;
  --green:#12A05C; --green-bg:#E8F7EE; --red:#DF524A; --red-bg:#FDECEC;
  --blue:#5B72C4; --blue-bg:#EEF0FB; --orange:#E38A3C; --orange-bg:#FFF2E6;
  --up:#DF524A; --up-bg:#FDECEC; --down:#2F62D8; --down-bg:#EAF0FE;
  --r:16px;
}
*{box-sizing:border-box;}
html,body,#root{margin:0;padding:0;min-height:100%;}
body{
  background:var(--bg); color:var(--ink); font-size:15px;
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

.bs{background:var(--bg); color:var(--ink); min-height:100vh;}
.bs-num{font-variant-numeric:tabular-nums;}

/* ── 유틸리티 (레이아웃) ─────────────────────────────────── */
.flex{display:flex;} .flex-wrap{flex-wrap:wrap;} .grid{display:grid;}
.items-center{align-items:center;} .items-start{align-items:flex-start;}
.justify-between{justify-content:space-between;} .justify-center{justify-content:center;} .justify-end{justify-content:flex-end;}
.text-center{text-align:center;}
.mx-auto{margin-left:auto;margin-right:auto;}
.overflow-x-auto{overflow-x:auto;}
.gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;} .gap-7{gap:28px;}
.gap-x-4{column-gap:16px;} .gap-y-6{row-gap:24px;}
.mb-3{margin-bottom:12px;} .mb-4{margin-bottom:16px;} .mb-5{margin-bottom:20px;} .mb-7{margin-bottom:28px;}
.mt-1{margin-top:4px;} .mt-2{margin-top:8px;} .mt-3{margin-top:12px;} .mt-4{margin-top:16px;} .mt-5{margin-top:20px;} .mt-6{margin-top:24px;}
.p-3{padding:12px;}
.px-5{padding-left:20px;padding-right:20px;} .px-6{padding-left:24px;padding-right:24px;}
.pb-3{padding-bottom:12px;} .pb-6{padding-bottom:24px;} .pt-4{padding-top:16px;}
.py-1{padding-top:4px;padding-bottom:4px;} .py-3{padding-top:12px;padding-bottom:12px;}
.py-4{padding-top:16px;padding-bottom:16px;} .py-5{padding-top:20px;padding-bottom:20px;}
.py-6{padding-top:24px;padding-bottom:24px;} .py-7{padding-top:28px;padding-bottom:28px;}
.py-8{padding-top:32px;padding-bottom:32px;} .py-9{padding-top:36px;padding-bottom:36px;}
.flex-1{flex:1;} .min-w-0{min-width:0;}

/* 상단 바 */
.bs-top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
.bs-mark{font-size:20px;font-weight:800;letter-spacing:-.03em;}
.bs-mark span{color:var(--green);}
.bs-pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:14px;color:var(--ink);}
.bs-pill:hover{background:var(--soft);}

/* 사이드바 */
.bs-side{width:212px;flex-shrink:0;}
@media (max-width:1060px){.bs-side{width:176px;}}
@media (max-width:760px){
  .bs-shell{gap:12px!important;padding-left:10px!important;padding-right:10px!important;}
  .bs-side{width:50px;}
  .bs-lbl{display:none;}
  .bs-nav button,.bs-group{justify-content:center;padding:12px 0;}
  .bs-nav .bs-sub{padding-left:0;}
  .bs-caret{display:none;}
  .bs-badge-n{margin-left:0;font-size:0;min-width:8px;width:8px;height:8px;padding:0;
    position:absolute;top:8px;right:7px;}
  .bs-nav>button,.bs-nav>div>button{position:relative;}
}
.bs-nav{display:flex;flex-direction:column;gap:2px;}
.bs-nav button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:12px;
  padding:11px 13px;font-size:15px;color:var(--ink);text-align:left;width:100%;}
.bs-nav button:hover{background:#EFEFF1;}
.bs-nav button[data-on="true"]{background:#EAEAEC;font-weight:700;}
.bs-nav .bs-sub{padding-left:34px;font-size:14.5px;color:#5C5C63;}
.bs-nav-ico{width:19px;text-align:center;font-size:15px;flex-shrink:0;}
.bs-group{display:flex;align-items:center;gap:10px;border:0;background:none;padding:11px 13px;width:100%;
  font-size:15px;color:var(--ink);border-radius:12px;}
.bs-group:hover{background:#EFEFF1;}
.bs-badge-n{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;
  min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;font-weight:700;}

/* 카드 */
.bs-card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);}
.bs-card-pad{padding:20px;}

/* 버튼 */
.bs-btn{border:0;background:var(--dark);color:#fff;border-radius:999px;padding:10px 18px;font-size:14.5px;font-weight:600;}
.bs-btn:hover{background:#000;}
.bs-btn-2{background:var(--soft);color:var(--ink);font-weight:500;}
.bs-btn-2:hover{background:#E6E6E9;}
.bs-btn-d{background:var(--red-bg);color:var(--red);font-weight:600;}
.bs-btn-d:hover{background:#FBDDDB;}
.bs-btn-sm{padding:7px 13px;font-size:13.5px;}
.bs-btn:disabled{opacity:.42;cursor:not-allowed;}

.bs-seg{background:var(--soft);border-radius:999px;padding:4px;display:inline-flex;gap:2px;}
.bs-seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-size:14px;color:var(--dim);}
.bs-seg button[data-on="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06);}

.bs-chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--dim);}
.bs-chip[data-on="true"]{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:600;}

/* 배지 */
.bs-badge{display:inline-block;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;}
.bs-b-green{background:var(--green-bg);color:var(--green);}
.bs-b-red{background:var(--red-bg);color:var(--red);}
.bs-b-blue{background:var(--blue-bg);color:var(--blue);}
.bs-b-orange{background:var(--orange-bg);color:var(--orange);}
.bs-b-gray{background:#8C8C93;color:#fff;border-radius:999px;padding:4px 13px;}

/* 코인 */
.bs-coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--coin);
  vertical-align:-2px;margin-right:5px;box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.55);}

/* 표 */
.bs-tbl{width:100%;border-collapse:collapse;}
.bs-tbl thead th{background:#FAFAFB;color:var(--dim);font-size:13px;font-weight:500;text-align:left;
  padding:13px 16px;border-bottom:1px solid var(--line);}
.bs-tbl tbody td{padding:15px 16px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle;}
.bs-tbl tbody tr:last-child td{border-bottom:0;}
.bs-tbl tbody tr:hover{background:#FCFCFD;}
.bs-r{text-align:right;}

/* 학생 카드 */
.bs-stu{position:relative;background:none;border:0;padding:0;width:100%;text-align:center;}
.bs-av{width:100%;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;color:#fff;
  font-size:28px;font-weight:700;letter-spacing:-.02em;border:2.5px solid transparent;transition:border-color .12s;}
.bs-stu[data-sel="true"] .bs-av{border-color:var(--ink);}
.bs-stu-name{font-size:14px;font-weight:600;margin-top:8px;}
.bs-stu-bal{font-size:12.5px;color:var(--dim);margin-top:2px;}
.bs-tick{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;background:var(--ink);
  color:#fff;font-size:12px;display:grid;place-items:center;}
.bs-pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;}
.bs-pop span{background:rgba(20,20,22,.9);color:#fff;border-radius:999px;padding:6px 14px;font-size:15px;
  font-weight:700;animation:bs-pop .8s ease-out forwards;}
@keyframes bs-pop{0%{opacity:0;transform:scale(.7) translateY(6px);}18%{opacity:1;transform:scale(1) translateY(0);}
  72%{opacity:1;}100%{opacity:0;transform:translateY(-10px);}}

/* 입력 */
.bs-in{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;font-size:15px;
  font-family:inherit;color:var(--ink);width:100%;}
.bs-in:focus{border-color:var(--ink);outline:none;}
.bs-ta{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;font-size:15px;
  font-family:inherit;color:var(--ink);width:100%;resize:vertical;line-height:1.7;}
.bs-ta:focus{border-color:var(--ink);outline:none;}
.bs-lab{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;}

/* 진행 바 */
.bs-bar{height:7px;background:var(--soft);border-radius:999px;overflow:hidden;}
.bs-bar i{display:block;height:100%;background:var(--ink);border-radius:999px;}
.bs-split{height:9px;border-radius:999px;overflow:hidden;display:flex;background:var(--soft);}

/* 액션 바 */
.bs-dock{position:sticky;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  box-shadow:0 -8px 24px rgba(0,0,0,.05);animation:bs-up .18s ease-out;}
@keyframes bs-up{from{transform:translateY(14px);opacity:0;}}

/* 모달 */
.bs-veil{position:fixed;inset:0;background:rgba(20,20,22,.4);display:grid;place-items:center;padding:16px;
  z-index:70;animation:bs-fade .14s ease-out;}
@keyframes bs-fade{from{opacity:0;}}
.bs-sheet{background:var(--card);border-radius:20px;width:100%;max-width:470px;max-height:88vh;overflow:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.22);}
.bs-sheet.wide{max-width:700px;}
.bs-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:14px;z-index:90;max-width:90vw;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.2);animation:bs-fade .14s ease-out;}

/* 시간표 */
.bs-tt{width:100%;border-collapse:separate;border-spacing:0;}
.bs-tt th,.bs-tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;padding:0;}
.bs-tt tr td:last-child,.bs-tt tr th:last-child{border-right:0;}
.bs-tt tbody tr:last-child td{border-bottom:0;}
.bs-tt thead th{background:#FAFAFB;color:var(--dim);font-size:13px;font-weight:500;padding:12px 0;}
.bs-tt input{border:0;background:transparent;text-align:center;width:100%;padding:14px 4px;font-size:14.5px;
  font-family:inherit;color:var(--ink);}
.bs-tt input:focus{outline:none;background:#F6F6F8;}

/* 주식 */
.bs-up{color:var(--up);} .bs-down{color:var(--down);} .bs-flat{color:var(--dim);}
.bs-tag-up{background:var(--up-bg);color:var(--up);}
.bs-tag-down{background:var(--down-bg);color:var(--down);}
.bs-tag-flat{background:var(--soft);color:var(--dim);}
.bs-spark{display:block;}
.bs-tick-code{font-size:12px;color:var(--dim);font-weight:500;letter-spacing:.04em;}
.bs-price{font-size:22px;font-weight:800;letter-spacing:-.02em;}
.bs-qty{display:flex;align-items:center;gap:8px;}
.bs-qty button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:18px;font-weight:700;color:var(--ink);flex-shrink:0;}
.bs-qty button:hover{background:var(--soft);}
.bs-qty input{text-align:center;}
.bs-mkt{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;}
.bs-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

@media (prefers-reduced-motion:reduce){.bs *{animation-duration:.001s!important;transition:none!important;}}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   Choi's — 학급 운영 도구 (Vanilla JS)

   저장소:
     1) 아래 CONFIG 에 Supabase 주소를 적으면 그 서버에 저장 (여러 기기 공유)
     2) 적지 않으면 이 브라우저 안에만 저장 (localStorage)
   ══════════════════════════════════════════════════════════ */

/* ── 여기만 고치면 여러 기기(학생 태블릿 등)에서 같은 데이터를 공유할 수 있어요 ── */
const CONFIG = {
  supabaseUrl: "",   // 예: "https://abcdefgh.supabase.co"
  supabaseKey: "",   // Project API keys 의 anon public 키
  rowId: "main",     // 한 계정으로 여러 학급을 쓸 때만 바꾸세요
};

const KEY = "choisclass:v1";
const DAYS = ["월", "화", "수", "목", "금"];
const SB = CONFIG.supabaseUrl && CONFIG.supabaseKey ? CONFIG : null;
const ROW = CONFIG.rowId || "main";

/* ── 저장소 ───────────────────────────────────────────── */
const sbHeaders = SB
  ? { apikey: SB.supabaseKey, Authorization: "Bearer " + SB.supabaseKey, "Content-Type": "application/json" }
  : null;

async function sbRead() {
  const r = await fetch(SB.supabaseUrl + "/rest/v1/class_state?id=eq." + ROW + "&select=data,updated_at", { headers: sbHeaders });
  if (!r.ok) throw new Error("read failed");
  const rows = await r.json();
  return rows[0] || null;
}
async function sbWrite(data) {
  const body = JSON.stringify({ id: ROW, data, updated_at: new Date().toISOString() });
  const r = await fetch(SB.supabaseUrl + "/rest/v1/class_state?on_conflict=id", {
    method: "POST",
    headers: Object.assign({}, sbHeaders, { Prefer: "resolution=merge-duplicates" }),
    body,
  });
  if (!r.ok) throw new Error("write failed");
}

const store = {
  mode: SB ? "server" : "local",
  async load() {
    try {
      if (this.mode === "server") {
        const row = await sbRead();
        return { data: row ? row.data : null, stamp: row ? row.updated_at : 0 };
      }
      const raw = window.localStorage.getItem(KEY);
      return { data: raw ? JSON.parse(raw) : null, stamp: 0 };
    } catch (e) {
      return { data: null, stamp: 0 };
    }
  },
  async save(data) {
    try {
      if (this.mode === "server") { await sbWrite(data); return true; }
      window.localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      return false;
    }
  },
  async stamp() {
    if (this.mode !== "server") return 0;
    try { const row = await sbRead(); return row ? row.updated_at : 0; } catch (e) { return 0; }
  },
};

/* ── 기본 데이터 ──────────────────────────────────────── */
const DEFAULT_DATA = {
  version: 2,
  className: "우리 반",
  currency: "포인트",
  interestRate: 3.5,
  pin: "",
  storeMode: "instant",
  students: [],
  items: [],
  quests: [],
  jobs: [],
  requests: [],
  stocks: [],
  market: { open: true, round: 0 },
  timetable: { periods: 6, cells: {} },
  log: [],
};

const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = (n) => Number(n || 0).toLocaleString("ko-KR");
const now = () => Date.now();
const when = (t) =>
  new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

const REASONS = ["발표", "도움", "숙제", "정리", "성실", "칭찬", "지각", "규칙 위반", "미제출"];
const KINDS = ["지급", "차감", "구매", "퀘스트", "급여", "이자", "입금", "출금", "주식", "배당"];
const CATS = ["간식", "쿠폰", "특권", "학용품", "기타"];

const AV = ["#F2A15C", "#5B8DEF", "#4FB980", "#B884E0", "#E4739B", "#E0B341", "#5FBCC8", "#A08A6B", "#7C86D6", "#D4785C"];
function avColor(seed) {
  let h = 0;
  seed = seed || "?";
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 9973;
  return AV[h % AV.length];
}

function migrate(raw) {
  const d = Object.assign({}, DEFAULT_DATA, raw || {});
  d.timetable = Object.assign({}, DEFAULT_DATA.timetable, d.timetable || {});
  d.market = Object.assign({ open: true, round: 0 }, d.market || {});

  /* 주식 종목 정리 */
  d.stocks = (Array.isArray(d.stocks) ? d.stocks : []).map((s) => {
    const price = Math.max(0, Math.round(Number(s.price) || 0));
    const prev = s.prev == null ? price : Math.max(0, Math.round(Number(s.prev) || 0));
    let history = Array.isArray(s.history) ? s.history.map((v) => Math.max(0, Math.round(Number(v) || 0))) : [];
    if (!history.length) history = [price];
    return {
      id: s.id || uid(),
      name: String(s.name || "이름 없는 종목"),
      code: String(s.code || ""),
      note: String(s.note || ""),
      price, prev,
      history: history.slice(-40),
    };
  });
  const stockIds = d.stocks.map((s) => s.id);

  /* 학생 정리 (+ 보유 주식) */
  d.students = (d.students || []).map((s) => {
    const base = Object.assign({ savings: 0, memo: "" }, s, { balance: Number(s.balance) || 0 });
    const src = base.holdings && typeof base.holdings === "object" ? base.holdings : {};
    const holdings = {};
    Object.keys(src).forEach((k) => {
      if (!stockIds.includes(k)) return;           // 사라진 종목은 버림
      const shares = Math.max(0, Math.floor(Number(src[k] && src[k].shares) || 0));
      if (shares <= 0) return;
      holdings[k] = { shares, avgCost: Math.max(0, Number(src[k].avgCost) || 0) };
    });
    base.holdings = holdings;
    base.savings = Math.max(0, Number(base.savings) || 0);
    return base;
  });

  d.items = (d.items || []).map((i) => Object.assign({ category: "기타" }, i));
  d.quests = (d.quests || []).map((q) => Object.assign({ open: true }, q, { done: q.done || [] }));
  ["jobs", "requests", "log"].forEach((k) => { if (!Array.isArray(d[k])) d[k] = []; });
  return d;
}

function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ══════════════════════════════════════════════════════════
   전역 상태
   ══════════════════════════════════════════════════════════ */
const S = {
  data: null,
  ready: false,
  mode: "teacher",        // "teacher" | "student"
  page: "home",            // 교사 화면 현재 페이지
  ecoOpen: true,
  sel: [],                 // 학급 홈에서 선택된 학생 id들
  amount: 10000,
  reason: "",
  toast: "",
  modal: null,             // { t: "...", ... }
  meId: null,              // 학생 모드에서 선택된 학생
  studentPage: "wallet",
  activityFilter: { who: "all", kind: "all", q: "" },
  questFilter: "all",
};
let saveTimer = null;
let myStamp = 0;
let firstLoad = true;
let toastTimer = null;

function patch(fn) {
  S.data = fn(S.data);
  scheduleSave();
  render();
}
/* 데이터는 바꾸지만 화면 전체를 다시 그리지 않음 (입력창 포커스를 지키기 위함) */
function patchQuiet(fn) {
  S.data = fn(S.data);
  scheduleSave();
}
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await store.save(S.data);
    myStamp = await store.stamp();
    saveTimer = null;
  }, 600);
}

function say(msg) {
  S.toast = msg;
  renderToast();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = ""; renderToast(); }, 2400);
}
function renderToast() {
  let el = document.getElementById("bs-toast-el");
  if (!S.toast) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement("div");
    el.id = "bs-toast-el";
    el.className = "bs-toast";
    document.body.appendChild(el);
  }
  el.textContent = S.toast;
}

function popStudents(ids, label) {
  ids.forEach((id) => {
    const card = document.querySelector('.bs-stu[data-id="' + id + '"]');
    if (!card) return;
    const old = card.querySelector(".bs-pop");
    if (old) old.remove();
    const pop = document.createElement("span");
    pop.className = "bs-pop";
    pop.innerHTML = "<span>" + escapeHtml(label) + "</span>";
    card.appendChild(pop);
    setTimeout(() => pop.remove(), 820);
  });
}

function move(ids, delta, why, kind) {
  if (!ids.length || !delta) return;
  patch((d) => {
    const at = now();
    const entries = [];
    const students = d.students.map((s) => {
      if (!ids.includes(s.id)) return s;
      entries.push({ id: uid(), at, kind, studentId: s.id, studentName: s.name, amount: delta, reason: why || kind });
      return Object.assign({}, s, { balance: s.balance + delta });
    });
    return Object.assign({}, d, { students, log: [...entries, ...d.log].slice(0, 3000) });
  });
  popStudents(ids, (delta > 0 ? "+" : "") + fmt(delta));
}

/* ══════════════════════════════════════════════════════════
   주식 계산 도우미
   ══════════════════════════════════════════════════════════ */
function stockChange(st) {
  const diff = st.price - st.prev;
  const pct = st.prev > 0 ? (diff / st.prev) * 100 : 0;
  return { diff, pct, dir: diff > 0 ? "up" : diff < 0 ? "down" : "flat" };
}
function changeBadge(st) {
  const c = stockChange(st);
  const arrow = c.dir === "up" ? "▲" : c.dir === "down" ? "▼" : "―";
  const cls = c.dir === "up" ? "bs-tag-up" : c.dir === "down" ? "bs-tag-down" : "bs-tag-flat";
  const sign = c.diff > 0 ? "+" : "";
  return '<span class="bs-badge ' + cls + ' bs-num">' + arrow + " " + sign + fmt(c.diff) + " (" + sign + c.pct.toFixed(1) + "%)</span>";
}
function sharesOf(student, stockId) {
  const h = student.holdings && student.holdings[stockId];
  return h ? h.shares : 0;
}
function totalSharesOf(stockId) {
  return S.data.students.reduce((a, s) => a + sharesOf(s, stockId), 0);
}
function holdersOf(stockId) {
  return S.data.students.filter((s) => sharesOf(s, stockId) > 0);
}
/* 학생 한 명의 주식 평가금액 / 투자원금 / 손익 */
function stockAssetOf(student) {
  let val = 0, cost = 0;
  const hs = student.holdings || {};
  Object.keys(hs).forEach((id) => {
    const st = S.data.stocks.find((x) => x.id === id);
    if (!st) return;
    val += st.price * hs[id].shares;
    cost += hs[id].avgCost * hs[id].shares;
  });
  return { val: Math.round(val), cost: Math.round(cost), gain: Math.round(val - cost) };
}
/* 꺾은선 미니 차트 */
function sparkline(history, w, h) {
  const data = (history || []).slice(-20);
  if (data.length < 2) return '<div style="width:' + w + 'px;height:' + h + 'px;"></div>';
  const min = Math.min.apply(null, data), max = Math.max.apply(null, data);
  const range = (max - min) || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * (w - 2) + 1;
    const y = h - 1 - ((v - min) / range) * (h - 2);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  const rising = data[data.length - 1] >= data[0];
  const color = rising ? "var(--up)" : "var(--down)";
  return '<svg class="bs-spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* ══════════════════════════════════════════════════════════
   모달 프레임 (열기/닫기 공통 처리)
   ══════════════════════════════════════════════════════════ */
function escHandler(e) { if (e.key === "Escape") closeModal(); }
function closeModal() {
  const veil = document.getElementById("bs-modal-veil");
  if (veil) veil.remove();
  document.removeEventListener("keydown", escHandler);
}
function showModal(title, bodyHtml, opts) {
  closeModal();
  const veil = document.createElement("div");
  veil.className = "bs-veil";
  veil.id = "bs-modal-veil";
  veil.innerHTML =
    '<div class="bs-sheet' + (opts && opts.wide ? " wide" : "") + '">' +
      '<div class="flex items-center justify-between px-6 py-5">' +
        '<h3 style="font-size:18px;font-weight:700;">' + escapeHtml(title) + "</h3>" +
        '<button class="bs-btn bs-btn-2 bs-btn-sm" id="bs-modal-close">닫기</button>' +
      "</div>" +
      '<div class="px-6 pb-6" id="bs-modal-body">' + bodyHtml + "</div>" +
    "</div>";
  document.body.appendChild(veil);
  veil.addEventListener("click", (e) => { if (e.target === veil) closeModal(); });
  document.getElementById("bs-modal-close").addEventListener("click", closeModal);
  document.addEventListener("keydown", escHandler);
  return document.getElementById("bs-modal-body");
}
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

/* ══════════ 학생 선택 모달 (구매/완료처리/배정 등에서 재사용) ══════════ */
function openStudentPicker(opts) {
  // opts: { students, title, hint, priceCheck, preset, confirmLabel, onConfirm }
  let sel = (opts.preset || []).slice();
  let q = "";
  const gridHtml = () => {
    const shown = opts.students.filter((s) => s.name.includes(q.trim()));
    return shown.map((s) => {
      const short = opts.priceCheck != null && s.balance < opts.priceCheck;
      return '<button type="button" class="bs-stu" data-id="' + s.id + '" data-sel="' + sel.includes(s.id) + '"' +
        (short ? ' style="opacity:.45;"' : '') + '>' +
        Avatar(s.name) +
        (sel.includes(s.id) ? '<span class="bs-tick">✓</span>' : '') +
        '<div class="bs-stu-name">' + s.no + '. ' + escapeHtml(s.name) + '</div>' +
        '<div class="bs-stu-bal">' + (short ? "부족" : fmt(s.balance)) + '</div>' +
      '</button>';
    }).join("");
  };
  const body =
    (opts.hint ? '<p style="font-size:13.5px;color:var(--dim);margin-bottom:12px;">' + opts.hint + '</p>' : '') +
    '<input class="bs-in" id="sp-q" placeholder="이름 검색" value="">' +
    '<div class="flex gap-2 mt-3 mb-3">' +
      '<button type="button" class="bs-chip" id="sp-all">전체 선택</button>' +
      '<button type="button" class="bs-chip" id="sp-none">해제</button>' +
    '</div>' +
    '<div class="grid gap-3 mb-5" id="sp-grid" style="grid-template-columns:repeat(auto-fill, minmax(78px, 1fr));">' + gridHtml() + '</div>' +
    '<div class="flex gap-2 justify-end">' +
      '<button type="button" class="bs-btn bs-btn-2" id="sp-cancel">취소</button>' +
      '<button type="button" class="bs-btn" id="sp-confirm" ' + (sel.length ? '' : 'disabled') + '>' +
        (sel.length ? sel.length + '명 확인' : '학생 선택') + '</button>' +
    '</div>';
  const root = showModal(opts.title, body, {});
  const refreshGrid = () => { $("#sp-grid", root).innerHTML = gridHtml(); };
  const refreshConfirm = () => {
    const btn = $("#sp-confirm", root);
    btn.disabled = !sel.length;
    btn.textContent = sel.length ? sel.length + "명 확인" : "학생 선택";
  };
  root.addEventListener("click", (e) => {
    const card = e.target.closest(".bs-stu");
    if (card) {
      const id = card.getAttribute("data-id");
      sel = sel.includes(id) ? sel.filter((x) => x !== id) : [...sel, id];
      refreshGrid(); refreshConfirm();
      return;
    }
    if (e.target.id === "sp-all") { sel = opts.students.filter((s) => s.name.includes(q.trim())).map((s) => s.id); refreshGrid(); refreshConfirm(); }
    if (e.target.id === "sp-none") { sel = []; refreshGrid(); refreshConfirm(); }
    if (e.target.id === "sp-cancel") closeModal();
    if (e.target.id === "sp-confirm" && sel.length) { const picked = sel.slice(); closeModal(); opts.onConfirm(picked); }
  });
  $("#sp-q", root).addEventListener("input", (e) => { q = e.target.value; refreshGrid(); });
}

/* ══════════ 선생님 화면 잠금 해제(PIN) 모달 ══════════ */
function openUnlockModal(pin, onOk) {
  const need = (pin || "").length === 4;
  let v = "";
  const body =
    (need
      ? '<p style="font-size:14.5px;">선생님 번호 네 자리를 입력해 주세요.</p>' +
        '<input class="bs-in bs-num mt-3" id="unlock-v" style="max-width:170px;font-size:22px;letter-spacing:.35em;" inputmode="numeric" maxlength="4" value="" autofocus>'
      : '<p style="font-size:14.5px;line-height:1.75;">선생님 화면으로 돌아갈까요? 설정에서 번호 네 자리를 정해두면 학생이 마음대로 나올 수 없어요.</p>') +
    '<div class="flex gap-2 justify-end mt-5">' +
      '<button type="button" class="bs-btn bs-btn-2" id="unlock-cancel">취소</button>' +
      '<button type="button" class="bs-btn" id="unlock-ok" ' + (need ? "disabled" : "") + '>돌아가기</button>' +
    '</div>';
  const root = showModal("선생님 화면으로", body, {});
  if (need) {
    $("#unlock-v", root).addEventListener("input", (e) => {
      v = e.target.value.replace(/\D/g, "").slice(0, 4);
      e.target.value = v;
      $("#unlock-ok", root).disabled = v !== pin;
    });
    $("#unlock-v", root).focus();
  }
  root.addEventListener("click", (e) => {
    if (e.target.id === "unlock-cancel") closeModal();
    if (e.target.id === "unlock-ok" && !e.target.disabled) { closeModal(); onOk(); }
  });
}

/* ══════════ 학생 추가 모달 ══════════ */
function openAddStudentsModal() {
  let text = "";
  const namesOf = (t) => t.split(/[\n,\t]+/).map((s) => s.trim()).filter(Boolean);
  const body =
    '<p style="font-size:13.5px;color:var(--dim);">엑셀에서 복사한 이름을 그대로 붙여넣어도 돼요.</p>' +
    '<textarea class="bs-ta mt-3" id="add-text" rows="8" placeholder="곽민수\n권찬민\n김시운"></textarea>' +
    '<div class="flex items-center justify-between mt-4">' +
      '<span class="bs-num" id="add-count" style="font-size:13.5px;color:var(--dim);">0명 인식</span>' +
      '<div class="flex gap-2">' +
        '<button type="button" class="bs-btn bs-btn-2" id="add-cancel">취소</button>' +
        '<button type="button" class="bs-btn" id="add-go" disabled>추가</button>' +
      '</div>' +
    '</div>';
  const root = showModal("학생 추가", body, {});
  $("#add-text", root).addEventListener("input", (e) => {
    text = e.target.value;
    const n = namesOf(text).length;
    $("#add-count", root).textContent = n + "명 인식";
    $("#add-go", root).disabled = !n;
  });
  root.addEventListener("click", (e) => {
    if (e.target.id === "add-cancel") closeModal();
    if (e.target.id === "add-go") {
      const names = namesOf(text);
      if (!names.length) return;
      patch((d) => {
        let no = d.students.reduce((m, s) => Math.max(m, s.no), 0);
        const added = names.map((n) => ({ id: uid(), no: ++no, name: n, balance: 0, savings: 0, memo: "" }));
        return Object.assign({}, d, { students: [...d.students, ...added] });
      });
      closeModal(); say(names.length + "명을 추가했어요.");
    }
  });
}

/* ══════════ 아이템 수정 모달 ══════════ */
function openItemModal(item) {
  let name = item ? item.name : "";
  let cat = item ? item.category : "간식";
  let price = item ? item.price : 10000;
  let limited = item ? item.stock != null : false;
  let stock = item && item.stock != null ? item.stock : 10;
  const body = () =>
    '<label class="bs-lab">아이템명</label>' +
    '<input class="bs-in" id="it-name" placeholder="뽀로로 비타민" value="' + escapeHtml(name) + '">' +
    '<label class="bs-lab" style="margin-top:16px;">분류</label>' +
    '<div class="flex gap-2 flex-wrap" id="it-cats">' + CATS.map((c) => '<button type="button" class="bs-chip" data-cat="' + c + '" data-on="' + (cat === c) + '">' + c + '</button>').join("") + '</div>' +
    '<label class="bs-lab" style="margin-top:16px;">가격</label>' +
    '<input class="bs-in bs-num" id="it-price" type="number" min="0" value="' + price + '">' +
    '<label class="bs-lab" style="margin-top:16px;">재고</label>' +
    '<div class="flex gap-2" id="it-limited">' +
      '<button type="button" class="bs-chip" data-lim="off" data-on="' + (!limited) + '">무제한</button>' +
      '<button type="button" class="bs-chip" data-lim="on" data-on="' + (limited) + '">수량 지정</button>' +
    '</div>' +
    (limited ? '<input class="bs-in bs-num mt-2" id="it-stock" type="number" min="0" value="' + stock + '">' : '') +
    '<div class="flex justify-between mt-6 gap-2">' +
      (item ? '<button type="button" class="bs-btn bs-btn-d" id="it-del">삭제</button>' : '<span></span>') +
      '<div class="flex gap-2">' +
        '<button type="button" class="bs-btn bs-btn-2" id="it-cancel">취소</button>' +
        '<button type="button" class="bs-btn" id="it-save" ' + (name.trim() ? '' : 'disabled') + '>저장</button>' +
      '</div>' +
    '</div>';
  const root = showModal(item ? "아이템 수정" : "아이템 만들기", body(), {});
  const rebind = () => { root.innerHTML = body(); };
  root.addEventListener("input", (e) => {
    if (e.target.id === "it-name") { name = e.target.value; $("#it-save", root).disabled = !name.trim(); }
    if (e.target.id === "it-price") price = Number(e.target.value);
    if (e.target.id === "it-stock") stock = Number(e.target.value);
  });
  root.addEventListener("click", (e) => {
    const c = e.target.getAttribute("data-cat");
    if (c) { cat = c; rebind(); return; }
    const lim = e.target.getAttribute("data-lim");
    if (lim) { limited = lim === "on"; rebind(); return; }
    if (e.target.id === "it-cancel") closeModal();
    if (e.target.id === "it-del") {
      patch((d) => Object.assign({}, d, { items: d.items.filter((x) => x.id !== item.id) }));
      closeModal();
    }
    if (e.target.id === "it-save" && name.trim()) {
      const it = { id: item ? item.id : uid(), name: name.trim(), category: cat, price: Math.max(0, price), stock: limited ? Math.max(0, stock) : null };

/* ══════════ 예금/출금(교사) 모달 ══════════ */
function openBankModal(dir) {
  const inMode = dir === "in";
  let sel = [];
  let amt = 10000;
  const gridHtml = () => S.data.students.map((s) =>
    '<button type="button" class="bs-stu" data-id="' + s.id + '" data-sel="' + sel.includes(s.id) + '">' +
      Avatar(s.name) +
      (sel.includes(s.id) ? '<span class="bs-tick">✓</span>' : '') +
      '<div class="bs-stu-name">' + escapeHtml(s.name) + '</div>' +
      '<div class="bs-stu-bal">' + fmt(inMode ? s.balance : (s.savings || 0)) + '</div>' +
    '</button>'
  ).join("");
  const body =
    '<p style="font-size:13.5px;color:var(--dim);">' +
      (inMode ? "지갑에서 예금으로 옮겨요. 잔액보다 많으면 있는 만큼만 옮깁니다." : "예금에서 지갑으로 돌려줘요. 예금보다 많으면 있는 만큼만 옮깁니다.") +
    '</p>' +
    '<label class="bs-lab" style="margin-top:14px;">금액</label>' +
    '<input class="bs-in bs-num" id="bk-amt" type="number" min="0" value="' + amt + '">' +
    '<div class="flex gap-2 mt-4 mb-3">' +
      '<button type="button" class="bs-chip" id="bk-all">전체</button>' +
      '<button type="button" class="bs-chip" id="bk-none">해제</button>' +
    '</div>' +
    '<div class="grid gap-3 mb-5" id="bk-grid" style="grid-template-columns:repeat(auto-fill, minmax(78px, 1fr));">' + gridHtml() + '</div>' +
    '<div class="flex gap-2 justify-end">' +
      '<button type="button" class="bs-btn bs-btn-2" id="bk-cancel">취소</button>' +
      '<button type="button" class="bs-btn" id="bk-go" disabled>' + (inMode ? "예금" : "출금") + '</button>' +
    '</div>';
  const root = showModal(inMode ? "예금 처리" : "출금 처리", body, {});
  const refreshGrid = () => { $("#bk-grid", root).innerHTML = gridHtml(); };
  const refreshGo = () => { $("#bk-go", root).disabled = !(sel.length && amt); };
  root.addEventListener("click", (e) => {
    const card = e.target.closest(".bs-stu");
    if (card) { const id = card.getAttribute("data-id"); sel = sel.includes(id) ? sel.filter((x) => x !== id) : [...sel, id]; refreshGrid(); refreshGo(); return; }
    if (e.target.id === "bk-all") { sel = S.data.students.map((s) => s.id); refreshGrid(); refreshGo(); }
    if (e.target.id === "bk-none") { sel = []; refreshGrid(); refreshGo(); }
    if (e.target.id === "bk-cancel") closeModal();
    if (e.target.id === "bk-go" && sel.length && amt) {
      const at = now(); const entries = [];
      patch((d) => {
        const ss = d.students.map((s) => {
          if (!sel.includes(s.id)) return s;
          const real = inMode ? Math.min(amt, s.balance) : Math.min(amt, s.savings || 0);
          if (real <= 0) return s;
          entries.push({ id: uid(), at, kind: inMode ? "입금" : "출금", studentId: s.id, studentName: s.name, amount: inMode ? -real : real, reason: inMode ? "예금 입금" : "예금 출금" });
          return inMode ? Object.assign({}, s, { balance: s.balance - real, savings: (s.savings || 0) + real })
                        : Object.assign({}, s, { balance: s.balance + real, savings: (s.savings || 0) - real });
        });
        return Object.assign({}, d, { students: ss, log: [...entries, ...d.log].slice(0, 3000) });
      });
      closeModal();
      say(entries.length ? entries.length + "명 처리했어요." : "옮길 금액이 없었어요.");
    }
  });
  $("#bk-amt", root).addEventListener("input", (e) => { amt = Math.max(0, Number(e.target.value)); refreshGo(); });
}

    '<p style="font-size:12.5px;color:var(--dim);margin-top:6px;">1 이상이어야 해요.' +

    '<label class="bs-lab" style="margin-top:16px;">한 줄 소개 (선택)</label>' +
    '<input class="bs-in" id="sk-note" placeholder="학용품을 파는 회사예요" value="' + escapeHtml(note) + '">' +
    (stock && shares
      ? '<div class="mt-4 p-3" style="background:var(--soft);border-radius:12px;font-size:13.5px;line-height:1.7;">' +
          '학생들이 모두 <b class="bs-num">' + fmt(shares) + '주</b>를 갖고 있어요.<br>' +
          '삭제하면 <b>현재 주가로 전부 현금으로 돌려주고</b> 종목이 사라져요.' +
        '</div>'
      : '') +
    '<div class="flex justify-between mt-6 gap-2">' +
      (stock ? '<button type="button" class="bs-btn bs-btn-d" id="sk-del">삭제</button>' : '<span></span>') +
      '<div class="flex gap-2">' +
        '<button type="button" class="bs-btn bs-btn-2" id="sk-cancel">취소</button>' +
        '<button type="button" class="bs-btn" id="sk-save" ' + (name.trim() && price > 0 ? '' : 'disabled') + '>저장</button>' +
      '</div>' +
    '</div>';

  const root = showModal(stock ? "종목 수정" : "종목 만들기", body, {});
  const okState = () => { $("#sk-save", root).disabled = !(name.trim() && price > 0); };
  root.addEventListener("input", (e) => {
    if (e.target.id === "sk-name") { name = e.target.value; okState(); }
    if (e.target.id === "sk-code") code = e.target.value;
    if (e.target.id === "sk-price") { price = Math.max(0, Math.round(Number(e.target.value) || 0)); okState(); }
    if (e.target.id === "sk-note") note = e.target.value;
  });
  root.addEventListener("click", (e) => {
    const t = e.target.closest("button") || e.target;
    if (t.id === "sk-cancel") { closeModal(); return; }
    if (t.id === "sk-del") { closeModal(); delistStock(stock); return; }
    if (t.id === "sk-save" && name.trim() && price > 0) {
      if (stock) {
        patch((d) => Object.assign({}, d, {
          stocks: d.stocks.map((x) => (x.id === stock.id
            ? Object.assign({}, x, { name: name.trim(), code: code.trim(), note: note.trim(), price, prev: x.prev })
            : x)),
        }));
      } else {
        const st = { id: uid(), name: name.trim(), code: code.trim(), note: note.trim(), price, prev: price, history: [price] };
        patch((d) => Object.assign({}, d, { stocks: [...d.stocks, st] }));
      }
      closeModal(); say("저장했어요.");
    }
  });
}

/* 상장폐지: 보유 학생에게 현재가로 현금 환급 후 종목 삭제 */
function delistStock(stock) {
  const holders = holdersOf(stock.id);
  const at = now();
  const entries = [];
  patch((d) => {
    const students = d.students.map((s) => {
      const sh = sharesOf(s, stock.id);
      if (!sh) return s;
      const back = sh * stock.price;
      entries.push({ id: uid(), at, kind: "주식", studentId: s.id, studentName: s.name, amount: back,
        reason: stock.name + " 상장폐지 · " + fmt(sh) + "주 환급" });
      const holdings = Object.assign({}, s.holdings);
      delete holdings[stock.id];
      return Object.assign({}, s, { balance: s.balance + back, holdings });
    });
    return Object.assign({}, d, {
      students,
      stocks: d.stocks.filter((x) => x.id !== stock.id),
      log: [...entries, ...d.log].slice(0, 3000),
    });
  });
  say(holders.length ? stock.name + " 삭제 · " + holders.length + "명에게 환급했어요." : stock.name + " 종목을 삭제했어요.");
}

/* ══════════ 시세 조정 모달 (종목 1개) ══════════ */
function openPriceModal(stock) {
  let next = stock.price;
  const preview = () => {
    const diff = next - stock.price;
    const pct = stock.price > 0 ? (diff / stock.price) * 100 : 0;
    const cls = diff > 0 ? "bs-up" : diff < 0 ? "bs-down" : "bs-flat";
    const sign = diff > 0 ? "+" : "";
    return '<div class="bs-num bs-price ' + cls + '">' + fmt(next) + '</div>' +
      '<div class="bs-num ' + cls + '" style="font-size:14px;font-weight:700;margin-top:2px;">' +
      sign + fmt(diff) + " (" + sign + pct.toFixed(1) + "%)</div>";
  };
  const body =
    '<div class="text-center" style="background:var(--soft);border-radius:14px;padding:18px 16px;">' +
      '<div style="font-size:13px;color:var(--dim);">지금 주가</div>' +
      '<div class="bs-num" style="font-size:20px;font-weight:700;margin-top:2px;">' + fmt(stock.price) + '</div>' +
      '<div style="font-size:13px;color:var(--dim);margin-top:14px;">바뀔 주가</div>' +
      '<div id="pv-box" class="mt-1">' + preview() + '</div>' +
    '</div>' +
    '<label class="bs-lab" style="margin-top:18px;">퍼센트로 조정</label>' +
    '<div class="flex gap-2 flex-wrap" id="pv-pcts">' +
      [-20, -10, -5, -1, 1, 5, 10, 20].map((p) =>
        '<button type="button" class="bs-chip" data-pct="' + p + '">' + (p > 0 ? "+" : "") + p + '%</button>').join("") +
    '</div>' +
    '<label class="bs-lab" style="margin-top:16px;">주가를 직접 입력</label>' +
    '<input class="bs-in bs-num" id="pv-price" type="number" min="0" step="100" value="' + next + '">' +
    '<div class="flex gap-2 mt-3 flex-wrap">' +
      '<button type="button" class="bs-chip" id="pv-random">무작위 (±15%)</button>' +
      '<button type="button" class="bs-chip" id="pv-reset">되돌리기</button>' +
    '</div>' +
    '<div class="flex gap-2 justify-end mt-6">' +
      '<button type="button" class="bs-btn bs-btn-2" id="pv-cancel">취소</button>' +
      '<button type="button" class="bs-btn" id="pv-go">시세 반영</button>' +
    '</div>';

  const root = showModal(stock.name + " 시세 조정", body, {});
  const sync = (writeInput) => {
    $("#pv-box", root).innerHTML = preview();
    if (writeInput) $("#pv-price", root).value = next;
  };
  root.addEventListener("input", (e) => {
    if (e.target.id === "pv-price") { next = Math.max(0, Math.round(Number(e.target.value) || 0)); sync(false); }
  });
  root.addEventListener("click", (e) => {
    const t = e.target.closest("button") || e.target;
    const p = t.getAttribute && t.getAttribute("data-pct");
    if (p) { next = Math.max(0, Math.round(stock.price * (1 + Number(p) / 100))); sync(true); return; }
    if (t.id === "pv-random") { const r = (Math.random() * 30 - 15) / 100; next = Math.max(0, Math.round(stock.price * (1 + r))); sync(true); return; }
    if (t.id === "pv-reset") { next = stock.price; sync(true); return; }
    if (t.id === "pv-cancel") { closeModal(); return; }
    if (t.id === "pv-go") {
      applyPrices([{ id: stock.id, price: next }]);
      closeModal(); say(stock.name + " 시세를 반영했어요.");
    }
  });
}

    return '<div class="py-3" style="border-bottom:1px solid var(--line);">' +

        '<div style="min-width:110px;"><div style="font-weight:600;">' + escapeHtml(st.name) + '</div>' +
          '<div class="bs-num" style="font-size:12.5px;color:var(--dim);">지금 ' + fmt(st.price) + '</div></div>' +
        '<input class="bs-in bs-num" style="width:120px;" type="number" min="0" step="100" data-mkt-price="' + st.id + '" value="' + n + '">' +
        '<div class="bs-num ' + cls + '" style="width:118px;text-align:right;font-weight:700;font-size:13.5px;">' +
          sign + fmt(diff) + '<br><span style="font-weight:500;">' + sign + pct.toFixed(1) + '%</span></div>' +
      '</div></div>';
  };

  const body =
    '<p style="font-size:13.5px;color:var(--dim);line-height:1.7;">한 회차에 모든 종목의 주가를 함께 바꿔요. ' +
    '적용하면 등락 기록이 남고 학생 화면의 그래프가 움직입니다.</p>' +
    '<div class="flex gap-2 mt-3 mb-1 flex-wrap">' +
      '<button type="button" class="bs-chip" id="mkt-rand-s">무작위 ±5%</button>' +
      '<button type="button" class="bs-chip" id="mkt-rand-m">무작위 ±15%</button>' +
      '<button type="button" class="bs-chip" id="mkt-bull">모두 호황 +10%</button>' +
      '<button type="button" class="bs-chip" id="mkt-bear">모두 불황 －10%</button>' +
      '<button type="button" class="bs-chip" id="mkt-reset">되돌리기</button>' +
    '</div>' +
    '<div id="mkt-list">' + stocks.map(rowHtml).join("") + '</div>' +
    '<div class="flex gap-2 justify-end mt-5">' +
      '<button type="button" class="bs-btn bs-btn-2" id="mkt-cancel">취소</button>' +
      '<button type="button" class="bs-btn" id="mkt-go">시세 반영</button>' +
    '</div>';

  const root = showModal("시세 변동", body, { wide: true });
  const redraw = () => { $("#mkt-list", root).innerHTML = stocks.map(rowHtml).join(""); };
  const setAll = (fn) => { stocks.forEach((st) => { next[st.id] = Math.max(0, Math.round(fn(st))); }); redraw(); };

  root.addEventListener("input", (e) => {
    const id = e.target.getAttribute("data-mkt-price");
    if (!id) return;
    next[id] = Math.max(0, Math.round(Number(e.target.value) || 0));
    /* 입력 중에는 포커스 유지를 위해 해당 줄만 갱신하지 않고 값만 저장 */
  });
  root.addEventListener("change", (e) => {
    if (e.target.getAttribute("data-mkt-price")) redraw();
  });
  root.addEventListener("click", (e) => {
    const t = e.target.closest("button") || e.target;
    if (t.id === "mkt-rand-s") { setAll((st) => st.price * (1 + (Math.random() * 10 - 5) / 100)); return; }
    if (t.id === "mkt-rand-m") { setAll((st) => st.price * (1 + (Math.random() * 30 - 15) / 100)); return; }
    if (t.id === "mkt-bull") { setAll((st) => st.price * 1.1); return; }
    if (t.id === "mkt-bear") { setAll((st) => st.price * 0.9); return; }
    if (t.id === "mkt-reset") { setAll((st) => st.price); return; }
    if (t.id === "mkt-cancel") { closeModal(); return; }
    if (t.id === "mkt-go") {
      applyPrices(stocks.map((st) => ({ id: st.id, price: next[st.id] })), true);
      closeModal(); say("이번 회차 시세를 반영했어요.");
    }
  });
}

/* 시세 반영 공통: prev 갱신 + history 추가 (+ 회차 증가). 주가는 최소 1 */
function applyPrices(list, bumpRound) {
  patch((d) => {
    const stocks = d.stocks.map((st) => {
      const hit = list.find((x) => x.id === st.id);
      if (!hit) return st;
      const p = Math.max(1, Math.round(Number(hit.price) || 0));
      return Object.assign({}, st, { prev: st.price, price: p, history: [...st.history, p].slice(-40) });
    });
    const market = bumpRound ? Object.assign({}, d.market, { round: (d.market.round || 0) + 1 }) : d.market;
    return Object.assign({}, d, { stocks, market });
  });
}

/* ══════════ 배당금 지급 모달 ══════════ */
function openDividendModal() {
  const stocks = S.data.stocks.filter((st) => totalSharesOf(st.id) > 0);
  if (!stocks.length) { say("주식을 보유한 학생이 없어요."); return; }
  let stockId = stocks[0].id;
  let per = 100;

  const summary = () => {
    const st = S.data.stocks.find((x) => x.id === stockId);
    const shares = totalSharesOf(stockId);
    const people = holdersOf(stockId).length;
    return '<div style="font-size:13.5px;line-height:1.8;">' +
      '<b>' + escapeHtml(st.name) + '</b> 보유 ' + people + '명 · 모두 <b class="bs-num">' + fmt(shares) + '주</b><br>' +
      '지급 총액 <b class="bs-num">' + fmt(shares * per) + '</b> ' + escapeHtml(S.data.currency) +
    '</div>';
  };
  const body =
    '<p style="font-size:13.5px;color:var(--dim);line-height:1.7;">1주당 얼마씩 나눠 줄지 정하면, 그 종목을 가진 학생에게 보유 수만큼 지급해요.</p>' +
    '<label class="bs-lab" style="margin-top:14px;">종목</label>' +
    '<select class="bs-in" id="dv-stock">' +
      stocks.map((st) => '<option value="' + st.id + '">' + escapeHtml(st.name) + '</option>').join("") +
    '</select>' +
    '<label class="bs-lab" style="margin-top:16px;">1주당 배당금</label>' +
    '<input class="bs-in bs-num" id="dv-per" type="number" min="0" step="10" value="' + per + '">' +
    '<div class="mt-4 p-3" id="dv-sum" style="background:var(--soft);border-radius:12px;">' + summary() + '</div>' +
    '<div class="flex gap-2 justify-end mt-6">' +
      '<button type="button" class="bs-btn bs-btn-2" id="dv-cancel">취소</button>' +
      '<button type="button" class="bs-btn" id="dv-go">배당 지급</button>' +
    '</div>';

  const root = showModal("배당금 지급", body, {});
  const sync = () => { $("#dv-sum", root).innerHTML = summary(); };
  root.addEventListener("input", (e) => {
    if (e.target.id === "dv-per") { per = Math.max(0, Math.round(Number(e.target.value) || 0)); sync(); }
  });
  root.addEventListener("change", (e) => {
    if (e.target.id === "dv-stock") { stockId = e.target.value; sync(); }
  });
  root.addEventListener("click", (e) => {
    const t = e.target.closest("button") || e.target;
    if (t.id === "dv-cancel") { closeModal(); return; }
    if (t.id === "dv-go") {
      if (!per) { say("배당금을 입력해 주세요."); return; }
      const st = S.data.stocks.find((x) => x.id === stockId);
      const at = now();
      const entries = [];
      patch((d) => {
        const students = d.students.map((s) => {
          const sh = sharesOf(s, stockId);
          if (!sh) return s;
          const amt = sh * per;
          entries.push({ id: uid(), at, kind: "배당", studentId: s.id, studentName: s.name, amount: amt,
            reason: st.name + " 배당 · " + fmt(sh) + "주" });
          return Object.assign({}, s, { balance: s.balance + amt });
        });
        return Object.assign({}, d, { students, log: [...entries, ...d.log].slice(0, 3000) });
      });
      closeModal();
      say(entries.length ? entries.length + "명에게 배당금을 지급했어요." : "지급할 대상이 없어요.");
    }
  });
}

/* ══════════ 학생 매수/매도 모달 ══════════ */
function openTradeModal(stock, side) {
  const me = S.data.students.find((s) => s.id === S.meId);
  if (!me) return;
  const buying = side === "buy";
  const have = sharesOf(me, stock.id);
  const maxQty = buying ? (stock.price > 0 ? Math.floor(me.balance / stock.price) : 0) : have;
  let qty = maxQty > 0 ? 1 : 0;

  const summary = () => {
    const total = qty * stock.price;
    const after = buying ? me.balance - total : me.balance + total;
    return '<div class="flex justify-between py-1"><span style="color:var(--dim);">' + (buying ? "드는 돈" : "받는 돈") + '</span>' +
        '<span class="bs-num" style="font-weight:700;">' + fmt(total) + '</span></div>' +
      '<div class="flex justify-between py-1"><span style="color:var(--dim);">거래 후 지갑</span>' +
        '<span class="bs-num" style="font-weight:700;">' + fmt(after) + '</span></div>' +
      '<div class="flex justify-between py-1"><span style="color:var(--dim);">거래 후 보유</span>' +
        '<span class="bs-num" style="font-weight:700;">' + fmt(buying ? have + qty : have - qty) + '주</span></div>';
  };
  const body =
    '<div class="text-center" style="background:var(--soft);border-radius:14px;padding:16px;">' +
      '<div style="font-weight:700;font-size:16px;">' + escapeHtml(stock.name) + '</div>' +
      '<div class="bs-num bs-price mt-1">' + fmt(stock.price) + '</div>' +
      '<div class="mt-1">' + changeBadge(stock) + '</div>' +
    '</div>' +
    '<div class="flex justify-between mt-4" style="font-size:13.5px;color:var(--dim);">' +
      '<span>내 지갑 <b class="bs-num" style="color:var(--ink);">' + fmt(me.balance) + '</b></span>' +
      '<span>보유 <b class="bs-num" style="color:var(--ink);">' + fmt(have) + '주</b></span>' +
    '</div>' +
    '<label class="bs-lab" style="margin-top:16px;">몇 주?</label>' +
    '<div class="bs-qty">' +
      '<button type="button" id="tq-minus">－</button>' +
      '<input class="bs-in bs-num" id="tq-input" type="number" min="0" max="' + maxQty + '" value="' + qty + '">' +
      '<button type="button" id="tq-plus">＋</button>' +
      '<button type="button" class="bs-chip" id="tq-max" style="flex-shrink:0;">최대</button>' +
    '</div>' +
    '<div class="bs-num" style="font-size:12.5px;color:var(--dim);margin-top:6px;">최대 ' + fmt(maxQty) + '주까지 가능해요.</div>' +
    '<div class="mt-4 p-3" id="tq-sum" style="background:var(--soft);border-radius:12px;font-size:14px;">' + summary() + '</div>' +
    '<div class="flex gap-2 justify-end mt-6">' +
      '<button type="button" class="bs-btn bs-btn-2" id="tq-cancel">취소</button>' +
      '<button type="button" class="bs-btn" id="tq-go" ' + (qty > 0 ? '' : 'disabled') + '>' + (buying ? "사기" : "팔기") + '</button>' +
    '</div>';

  const root = showModal(buying ? "주식 사기" : "주식 팔기", body, {});
  const sync = () => {
    $("#tq-input", root).value = qty;
    $("#tq-sum", root).innerHTML = summary();
    $("#tq-go", root).disabled = qty <= 0;
  };
  root.addEventListener("input", (e) => {
    if (e.target.id === "tq-input") {
      const raw = e.target.value;
      qty = Math.max(0, Math.min(maxQty, Math.floor(Number(raw) || 0)));
      /* 최대치를 넘겨 적으면 곧바로 최대치로 고쳐 보여 준다 (지우는 중이면 건드리지 않음) */
      if (raw !== "" && String(qty) !== raw) e.target.value = qty;
      $("#tq-sum", root).innerHTML = summary();
      $("#tq-go", root).disabled = qty <= 0;
    }
  });
  root.addEventListener("click", (e) => {
    const t = e.target.closest("button") || e.target;
    if (t.id === "tq-minus") { qty = Math.max(0, qty - 1); sync(); return; }
    if (t.id === "tq-plus") { qty = Math.min(maxQty, qty + 1); sync(); return; }
    if (t.id === "tq-max") { qty = maxQty; sync(); return; }
    if (t.id === "tq-cancel") { closeModal(); return; }
    if (t.id === "tq-go" && qty > 0) { closeModal(); doTrade(stock.id, side, qty); }
  });
}

function resolveRequest(req, ok) {
  const d0 = S.data;
  if (ok) {
    if (req.type === "구매") {
      const it = d0.items.find((i) => i.id === req.refId);
      const st = d0.students.find((s) => s.id === req.studentId);
      if (!it || !st) return;
      if (st.balance < it.price) { say(st.name + " 학생 잔액이 부족합니다."); return; }
      if (it.stock != null && it.stock <= 0) { say("품절된 아이템입니다."); return; }
      move([st.id], -it.price, it.name + " 구매", "구매");
      patch((d) => Object.assign({}, d, { items: d.items.map((x) => (x.id === it.id && x.stock != null ? Object.assign({}, x, { stock: Math.max(0, x.stock - 1) }) : x)) }));
    } else {
      const q = d0.quests.find((x) => x.id === req.refId);
      if (!q) return;
      move([req.studentId], q.reward, "퀘스트 · " + q.title, "퀘스트");
      patch((d) => Object.assign({}, d, { quests: d.quests.map((x) => (x.id === q.id ? Object.assign({}, x, { done: Array.from(new Set([...x.done, req.studentId])) }) : x)) }));
    }
  }
  patch((d) => Object.assign({}, d, { requests: d.requests.map((r) => (r.id === req.id ? Object.assign({}, r, { status: ok ? "승인" : "거절" }) : r)) }));
}

/* ══════════════════════════════════════════════════════════
   교사 화면 — 재테크
   ══════════════════════════════════════════════════════════ */
function renderFinancePage() {
  const d = S.data;
  const students = d.students;
  const wallet = students.reduce((a, s) => a + s.balance, 0);
  const saved = students.reduce((a, s) => a + (s.savings || 0), 0);
  const invested = students.reduce((a, s) => a + stockAssetOf(s).val, 0);
  const total = wallet + saved + invested;
  const pct = (n) => (total ? Math.round((n / total) * 100) : 0);

  let html = PageHead("재테크", "지갑에서 예금으로 옮기고 이자를 붙여 복리를 체험시켜요.",
    '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" id="fin-in" ' + (students.length ? '' : 'disabled') + '>예금 처리</button>' +
    '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" id="fin-out" ' + (students.length ? '' : 'disabled') + '>출금 처리</button>' +
    '<button type="button" class="bs-btn bs-btn-sm" id="fin-interest" ' + (saved ? '' : 'disabled') + '>이자 지급</button>');

  html += '<div class="grid gap-4 mb-5" style="grid-template-columns:repeat(auto-fit, minmax(268px, 1fr));">';
  html += '<div class="bs-card bs-card-pad">' +
    '<div style="font-size:13.5px;color:var(--dim);">학급 총 자산</div>' +
    '<div class="bs-num" style="font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:6px;">' + fmt(total) + ' <span style="font-size:14px;font-weight:500;color:var(--dim);">' + escapeHtml(d.currency) + '</span></div>' +
    '<div class="bs-split mt-4"><i style="width:' + pct(wallet) + '%;background:var(--green);"></i><i style="width:' + pct(saved) + '%;background:var(--coin);"></i><i style="width:' + pct(invested) + '%;background:var(--blue);"></i></div>' +
    '<div class="mt-4" style="font-size:14px;">' +
      '<div class="flex items-center justify-between py-1"><span class="flex items-center gap-2"><i style="width:8px;height:8px;border-radius:99px;background:var(--green);display:inline-block;"></i>쓸 수 있는 돈</span>' +
      '<span class="bs-num" style="font-weight:700;">' + fmt(wallet) + ' <span style="color:var(--dim);font-weight:400;">(' + pct(wallet) + '%)</span></span></div>' +
      '<div class="flex items-center justify-between py-1"><span class="flex items-center gap-2"><i style="width:8px;height:8px;border-radius:99px;background:var(--coin);display:inline-block;"></i>예금</span>' +
      '<span class="bs-num" style="font-weight:700;">' + fmt(saved) + ' <span style="color:var(--dim);font-weight:400;">(' + pct(saved) + '%)</span></span></div>' +
      '<div class="flex items-center justify-between py-1"><span class="flex items-center gap-2"><i style="width:8px;height:8px;border-radius:99px;background:var(--blue);display:inline-block;"></i>주식</span>' +
      '<span class="bs-num" style="font-weight:700;">' + fmt(invested) + ' <span style="color:var(--dim);font-weight:400;">(' + pct(invested) + '%)</span></span></div>' +
    '</div></div>';
  html += '<div class="bs-card bs-card-pad">' +
    '<div class="flex items-center justify-between"><span style="font-size:15px;font-weight:700;">은행</span></div>' +
    '<div style="background:var(--green-bg);border-radius:14px;padding:26px 16px;text-align:center;margin-top:14px;">' +
      '<div style="font-size:13.5px;color:var(--green);">예금 이자율</div>' +
      '<div class="bs-num" id="fin-rate-display" style="font-size:40px;font-weight:800;color:var(--green);line-height:1.1;margin-top:4px;">' + d.interestRate + '%</div>' +
    '</div>' +
    '<label class="bs-lab" style="margin-top:16px;">이자율 조절 (한 번 지급할 때 %)</label>' +
    '<input class="bs-in bs-num" id="fin-rate" type="number" min="0" max="100" step="0.5" value="' + d.interestRate + '">' +
  '</div>';
  html += '</div>';

  if (!students.length) {
    html += Empty("학급 홈에서 명단을 먼저 만들어 주세요.");
  } else {
    html += '<div class="bs-card" style="overflow:hidden;"><div style="overflow-x:auto;"><table class="bs-tbl">' +
      '<thead><tr><th>학생</th><th class="bs-r">쓸 수 있는 돈</th><th class="bs-r">예금</th><th class="bs-r">주식</th><th class="bs-r">합계</th></tr></thead><tbody>';
    students.forEach((s) => {
      const sv = stockAssetOf(s).val;
      html += '<tr><td><span class="flex items-center gap-2">' + Avatar(s.name, 28) + '<span style="font-weight:600;">' + s.no + '. ' + escapeHtml(s.name) + '</span></span></td>' +
        '<td class="bs-r">' + Coin(s.balance) + '</td>' +
        '<td class="bs-r bs-num" style="color:var(--dim);">' + fmt(s.savings || 0) + '</td>' +
        '<td class="bs-r bs-num" style="color:var(--dim);">' + fmt(sv) + '</td>' +
        '<td class="bs-r bs-num" style="font-weight:700;">' + fmt(s.balance + (s.savings || 0) + sv) + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  return html;
}

    '<button type="button" class="bs-btn bs-btn-sm" id="quest-new">＋ 퀘스트 만들기</button>');
  html += '<div class="bs-seg mb-4" id="quest-filt">' +
    [["all", "전체"], ["open", "진행중"], ["closed", "종료"]].map((p) => '<button type="button" data-filt="' + p[0] + '" data-on="' + (filt === p[0]) + '">' + p[1] + '</button>').join("") +
  '</div>';
  if (!quests.length) {
    html += Empty("퀘스트가 없어요.",
      '<button type="button" class="bs-btn" id="quest-new2">퀘스트 만들기</button>' +

  } else {
    html += '<div class="bs-card" style="overflow:hidden;"><div style="overflow-x:auto;"><table class="bs-tbl">' +
      '<thead><tr><th style="width:88px;">상태</th><th>퀘스트 제목</th><th class="bs-r" style="width:130px;">보상</th><th style="width:150px;">완료</th><th style="width:190px;"></th></tr></thead><tbody>';
    shown.forEach((q) => {
      const total = students.length || 1;
      html += '<tr><td>' + (q.open ? '<span class="bs-badge bs-b-green">진행중</span>' : '<span class="bs-badge bs-b-gray">종료</span>') + '</td>' +
        '<td><div style="font-weight:600;">' + escapeHtml(q.title) + '</div>' + (q.note ? '<div style="font-size:13px;color:var(--dim);margin-top:2px;">' + escapeHtml(q.note) + '</div>' : '') + '</td>' +
        '<td class="bs-r">' + Coin(q.reward) + '</td>' +
        '<td><div class="flex items-center gap-2"><div class="bs-bar" style="flex:1;"><i style="width:' + Math.min(100, (q.done.length / total) * 100) + '%;"></i></div>' +
          '<span class="bs-num" style="font-size:13px;font-weight:700;">' + q.done.length + '/' + students.length + '</span></div></td>' +
        '<td class="bs-r"><span class="flex gap-2 justify-end">' +
          '<button type="button" class="bs-btn bs-btn-sm" data-quest-done="' + q.id + '" ' + (!students.length ? 'disabled' : '') + '>완료 처리</button>' +
          '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" data-quest-toggle="' + q.id + '">' + (q.open ? "종료" : "재개") + '</button>' +
          '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" data-quest-edit="' + q.id + '">수정</button>' +
        '</span></td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  return html;
}

/* ══════════════════════════════════════════════════════════
   시간표 (교사/학생 공용)
   ══════════════════════════════════════════════════════════ */
function timetableHtml(readOnly) {
  const tt = S.data.timetable;
  let html = PageHead("시간표", readOnly ? "이번 주 시간표예요." : "칸을 눌러 바로 적으면 저장돼요.",
    readOnly ? "" :
      '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" id="tt-minus" ' + (tt.periods <= 3 ? 'disabled' : '') + '>교시 －</button>' +
      '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" id="tt-plus" ' + (tt.periods >= 8 ? 'disabled' : '') + '>교시 ＋</button>');
  html += '<div class="bs-card" style="overflow:hidden;"><div style="overflow-x:auto;"><table class="bs-tt">' +
    '<thead><tr><th style="width:52px;"></th>' + DAYS.map((dd) => '<th>' + dd + '</th>').join("") + '</tr></thead><tbody>';
  for (let p = 0; p < tt.periods; p++) {
    html += '<tr><th>' + (p + 1) + '</th>';
    for (let di = 0; di < DAYS.length; di++) {
      const k = di + "-" + p;
      const val = tt.cells[k] || "";
      html += '<td>' + (readOnly
        ? '<div style="padding:14px 4px;font-size:14.5px;min-height:46px;">' + escapeHtml(val) + '</div>'
        : '<input data-tt-cell="' + k + '" value="' + escapeHtml(val) + '" placeholder="—">') + '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table></div></div>';
  return html;
}

/* ══════════════════════════════════════════════════════════
   교사 화면 — 주식 (가상 종목, 시세는 선생님이 직접 정함)
   ══════════════════════════════════════════════════════════ */
function renderStocksPage() {
  const d = S.data;
  const stocks = d.stocks;
  const open = d.market.open;

  let html = PageHead("주식", "종목을 만들고 시세를 직접 정해요. 학생은 지갑 돈으로 사고팔 수 있어요.",
    '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" id="mk-toggle">' + (open ? "거래 마감하기" : "거래 열기") + '</button>' +
    '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" id="mk-dividend" ' + (stocks.length ? '' : 'disabled') + '>배당금 지급</button>' +
    '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" id="mk-batch" ' + (stocks.length ? '' : 'disabled') + '>시세 변동</button>' +
    '<button type="button" class="bs-btn bs-btn-sm" id="stk-new">＋ 종목 만들기</button>');

  /* 시장 상태 카드 */
  const totalMarketValue = stocks.reduce((a, st) => a + st.price * totalSharesOf(st.id), 0);
  html += '<div class="bs-card bs-card-pad mb-4 flex items-center justify-between gap-3 flex-wrap">' +
    '<span class="bs-mkt">' +
      '<i class="bs-dot" style="background:' + (open ? "var(--green)" : "var(--mute)") + ';"></i>' +
      (open ? "거래 열림 · 학생이 사고팔 수 있어요" : "거래 마감 · 학생은 보기만 할 수 있어요") +
    '</span>' +
    '<span style="font-size:13.5px;color:var(--dim);">' +
      '거래 회차 <b class="bs-num" style="color:var(--ink);">' + d.market.round + '</b>회 · ' +
      '학생 보유 주식 평가액 <b class="bs-num" style="color:var(--ink);">' + fmt(totalMarketValue) + '</b> ' + escapeHtml(d.currency) +
    '</span>' +
  '</div>';

  if (!stocks.length) {
    html += Empty("아직 종목이 없어요.",
      '<button type="button" class="bs-btn" id="stk-new2">종목 만들기</button>' +
      '<button type="button" class="bs-btn bs-btn-2" id="stk-sample">예시로 채우기</button>');
    return html;
  }

  /* 종목 표 */
  html += '<div class="bs-card mb-5" style="overflow:hidden;"><div style="overflow-x:auto;"><table class="bs-tbl">' +
    '<thead><tr><th style="width:190px;">종목</th><th class="bs-r" style="width:120px;">현재가</th>' +
    '<th style="width:150px;">등락</th><th style="width:90px;">흐름</th>' +
    '<th style="width:130px;">학생 보유</th><th style="width:200px;"></th></tr></thead><tbody>';
  stocks.forEach((st) => {
    const shares = totalSharesOf(st.id);
    const holders = holdersOf(st.id).length;
    html += '<tr>' +
      '<td><div style="font-weight:600;">' + escapeHtml(st.name) + '</div>' +
        (st.code ? '<div class="bs-tick-code">' + escapeHtml(st.code) + '</div>' : '') +
        (st.note ? '<div style="font-size:12.5px;color:var(--dim);margin-top:2px;">' + escapeHtml(st.note) + '</div>' : '') + '</td>' +
      '<td class="bs-r">' + Coin(st.price) + '</td>' +
      '<td>' + changeBadge(st) + '</td>' +
      '<td>' + sparkline(st.history, 72, 30) + '</td>' +
      '<td class="bs-num" style="font-size:13.5px;">' + (shares ? fmt(shares) + '주 · ' + holders + '명' : '<span style="color:var(--mute);">없음</span>') + '</td>' +
      '<td class="bs-r"><span class="flex gap-2 justify-end">' +
        '<button type="button" class="bs-btn bs-btn-sm" data-stk-price="' + st.id + '">시세 조정</button>' +
        '<button type="button" class="bs-btn bs-btn-2 bs-btn-sm" data-stk-edit="' + st.id + '">수정</button>' +
      '</span></td></tr>';
  });
  html += '</tbody></table></div></div>';

  /* 학생별 보유 현황 */
  const investors = d.students.filter((s) => Object.keys(s.holdings || {}).length);
  html += '<div style="font-size:15px;font-weight:700;margin-bottom:12px;">학생별 보유 현황</div>';
  if (!investors.length) {
    html += Empty("아직 주식을 산 학생이 없어요.");
  } else {
    html += '<div class="bs-card" style="overflow:hidden;"><div style="overflow-x:auto;"><table class="bs-tbl">' +
      '<thead><tr><th style="width:150px;">학생</th><th>보유 종목</th>' +
      '<th class="bs-r" style="width:120px;">투자원금</th><th class="bs-r" style="width:120px;">평가금액</th>' +
      '<th class="bs-r" style="width:130px;">손익</th></tr></thead><tbody>';
    investors.forEach((s) => {
      const a = stockAssetOf(s);
      const cls = a.gain > 0 ? "bs-up" : a.gain < 0 ? "bs-down" : "bs-flat";
      const sign = a.gain > 0 ? "+" : "";
      const rate = a.cost > 0 ? " (" + sign + ((a.gain / a.cost) * 100).toFixed(1) + "%)" : "";
      const tags = Object.keys(s.holdings).map((id) => {
        const st = d.stocks.find((x) => x.id === id);
        if (!st) return "";
        return '<span class="bs-badge" style="background:var(--soft);color:var(--ink);border-radius:999px;padding:5px 12px;">' +
          escapeHtml(st.name) + ' <b class="bs-num">' + s.holdings[id].shares + '주</b></span>';
      }).join("");
      html += '<tr>' +
        '<td><span class="flex items-center gap-2">' + Avatar(s.name, 28) + '<span style="font-weight:600;">' + s.no + '. ' + escapeHtml(s.name) + '</span></span></td>' +
        '<td><span class="flex gap-2 flex-wrap">' + tags + '</span></td>' +
        '<td class="bs-r bs-num" style="color:var(--dim);">' + fmt(a.cost) + '</td>' +
        '<td class="bs-r bs-num" style="font-weight:700;">' + fmt(a.val) + '</td>' +
        '<td class="bs-r bs-num ' + cls + '" style="font-weight:700;">' + sign + fmt(a.gain) + rate + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  return html;
}

function studentAppHtml() {
  const d = S.data;
  const me = d.students.find((s) => s.id === S.meId);
  if (!me) {
    let html = '<div class="bs"><div class="mx-auto px-5 py-9" style="max-width:780px;">' +
      '<div class="flex items-start justify-between gap-3 mb-7">' +
        '<div><div style="font-size:13.5px;color:var(--dim);">' + escapeHtml(d.className) + '</div>' +
        '<h1 style="font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:4px;">내 이름을 눌러 주세요</h1></div>' +
        '<button type="button" class="bs-pill" id="stu-exit">선생님</button>' +
      '</div>';
    if (!d.students.length) {
      html += Empty("아직 명단이 없어요. 선생님을 불러 주세요.");
    } else {
      html += '<div class="grid gap-x-4 gap-y-6" style="grid-template-columns:repeat(auto-fill, minmax(92px, 1fr));">' +
        d.students.map((s) => '<button type="button" class="bs-stu" data-pick="' + s.id + '">' + Avatar(s.name) +
          '<div class="bs-stu-name">' + s.no + '. ' + escapeHtml(s.name) + '</div></button>').join("") + '</div>';
    }
    html += '</div></div>';
    return html;
  }

  const jobs = d.jobs, quests = d.quests, items = d.items, requests = d.requests, log = d.log;
  const instant = d.storeMode !== "approval";
  const myJob = jobs.find((j) => j.holders.includes(me.id));
  const myLog = log.filter((e) => e.studentId === me.id).slice(0, 20);
  const waiting = (type, refId) => requests.some((r) => r.studentId === me.id && r.type === type && r.refId === refId && r.status === "대기");
  const NAV = [["wallet", "내 계좌"], ["activity", "활동 기록"], ["quest", "퀘스트"], ["store", "상점"], ["stocks", "주식"], ["tt", "시간표"]];
  const total = me.balance + (me.savings || 0);
  const pct = (n) => (total ? Math.round((n / total) * 100) : 0);

  let html = '<div class="bs">' +
    '<div class="bs-top">' +
      '<div class="mx-auto px-5 py-3 flex items-center justify-between gap-3" style="max-width:900px;">' +
        '<div class="flex items-center gap-3">' + Avatar(me.name, 36) +
        '<div><div style="font-weight:700;font-size:15px;">' + me.no + '. ' + escapeHtml(me.name) + '</div>' +
        '<div style="font-size:12.5px;color:var(--dim);">' + escapeHtml(d.className) + '</div></div></div>' +
        '<button type="button" class="bs-pill" id="stu-switch">바꾸기</button>' +
      '</div>' +
      '<div class="mx-auto px-5 pb-3 flex gap-2 overflow-x-auto" style="max-width:900px;">' +
        NAV.map((n) => '<button type="button" class="bs-chip" data-stupage="' + n[0] + '" data-on="' + (S.studentPage === n[0]) + '">' + n[1] + '</button>').join("") +
      '</div>' +
    '</div>' +
    '<div class="mx-auto px-5 py-6" style="max-width:900px;">';

  if (S.studentPage === "wallet") {
    html += '<div class="grid gap-4"><div class="bs-card bs-card-pad">' +
      '<div style="font-size:13.5px;color:var(--dim);">내 계좌</div>' +
      '<div class="bs-num" style="font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:4px;">' + fmt(total) + ' <span style="font-size:14px;font-weight:500;color:var(--dim);">' + escapeHtml(d.currency) + '</span></div>' +
      '<div class="bs-split mt-4"><i style="width:' + pct(me.balance) + '%;background:var(--green);"></i><i style="width:' + pct(me.savings || 0) + '%;background:var(--coin);"></i></div>' +
      '<div class="mt-4" style="font-size:14px;">' +
        '<div class="flex justify-between py-1"><span class="flex items-center gap-2"><i style="width:8px;height:8px;border-radius:99px;background:var(--green);display:inline-block;"></i>쓸 수 있는 돈</span>' +
        '<span class="bs-num" style="font-weight:700;">' + fmt(me.balance) + ' <span style="color:var(--dim);font-weight:400;">(' + pct(me.balance) + '%)</span></span></div>' +
        '<div class="flex justify-between py-1"><span class="flex items-center gap-2"><i style="width:8px;height:8px;border-radius:99px;background:var(--coin);display:inline-block;"></i>예금</span>' +
        '<span class="bs-num" style="font-weight:700;">' + fmt(me.savings || 0) + ' <span style="color:var(--dim);font-weight:400;">(' + pct(me.savings || 0) + '%)</span></span></div>' +
      '</div>' +
      '<div class="mt-4 pt-4" style="border-top:1px solid var(--line);">' +
        '<label class="bs-lab">예금하거나 출금할 금액</label>' +
        '<div class="flex gap-2 flex-wrap">' +
          '<input class="bs-in bs-num" id="stu-bank-amt" style="max-width:160px;" type="number" min="0" value="" placeholder="0">' +
          '<button type="button" class="bs-btn" id="stu-bank-in">예금하기</button>' +
          '<button type="button" class="bs-btn bs-btn-2" id="stu-bank-out">출금하기</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    html += '<div class="bs-card bs-card-pad">' +
      '<div style="font-size:13.5px;color:var(--dim);">내 직업</div>' +
      '<div style="font-size:20px;font-weight:700;margin-top:4px;">' + (myJob ? escapeHtml(myJob.name) : "없음") + '</div>' +
      (myJob ? '<div style="font-size:14px;color:var(--dim);margin-top:2px;">' + escapeHtml(myJob.duty || "") + '</div>' +
        '<div class="mt-2">' + Coin(myJob.salary) + ' <span style="font-size:13px;color:var(--dim);">급여</span></div>' : '') +
    '</div>';
    html += '<div class="bs-card" style="overflow:hidden;">' +
      '<div class="px-5 py-4" style="border-bottom:1px solid var(--line);font-weight:700;font-size:15px;">최근 활동</div>' +
      (!myLog.length ? '<p class="px-5 py-8 text-center" style="color:var(--dim);font-size:14px;">아직 기록이 없어요.</p>' :
        myLog.map((e) => '<div class="px-5 py-3 flex items-center gap-3" style="border-bottom:1px solid var(--line);">' +
          '<div style="flex:1;"><div style="font-weight:600;font-size:14.5px;">' + escapeHtml(e.kind) + '</div>' +
          '<div style="font-size:12.5px;color:var(--dim);margin-top:2px;">' + escapeHtml(e.reason || "") + ' · ' + when(e.at) + '</div></div>' +
          '<span class="bs-num" style="font-weight:700;color:' + (e.amount > 0 ? "var(--ink)" : "var(--red)") + ';">' + (e.amount > 0 ? "+" : "") + fmt(e.amount) + '</span></div>').join("")) +
    '</div></div>';
  }

  if (S.studentPage === "quest") {
    const open = quests.filter((q) => q.open);
    if (!open.length) html += Empty("지금 진행 중인 퀘스트가 없어요.");
    else {
      html += '<div class="grid gap-3">' + open.map((q) => {
        const done = q.done.includes(me.id);
        const wait = waiting("퀘스트", q.id);
        return '<div class="bs-card bs-card-pad flex items-center gap-3 flex-wrap">' +
          '<div style="flex:1;min-width:150px;"><div style="font-weight:700;font-size:16px;">' + escapeHtml(q.title) + '</div>' +
          (q.note ? '<div style="font-size:13.5px;color:var(--dim);margin-top:2px;">' + escapeHtml(q.note) + '</div>' : '') +
          '<div class="mt-2">' + Coin(q.reward) + '</div></div>' +
          '<button type="button" class="bs-btn" data-quest-ask="' + q.id + '" ' + (done || wait ? 'disabled' : '') + '>' + (done ? "완료" : wait ? "확인 중" : "다 했어요") + '</button></div>';
      }).join("") + '</div>';
    }
  }

  if (S.studentPage === "store") {
    if (!items.length) html += Empty("상점이 비어 있어요.");
    else {
      html += '<div class="bs-card" style="overflow:hidden;">' + items.map((it) => {
        const wait = waiting("구매", it.id);
        const soldOut = it.stock != null && it.stock <= 0;
        const poor = me.balance < it.price;
        return '<div class="px-5 py-4 flex items-center gap-3 flex-wrap" style="border-bottom:1px solid var(--line);">' +
          '<span class="bs-badge bs-b-blue">' + it.category + '</span>' +
          '<div style="flex:1;min-width:130px;"><div style="font-weight:600;">' + escapeHtml(it.name) + '</div>' +
          '<div class="mt-1">' + Coin(it.price) + (it.stock != null ? '<span style="font-size:13px;color:var(--dim);margin-left:8px;">재고 ' + it.stock + '</span>' : '') + '</div></div>' +
          '<button type="button" class="bs-btn" data-store-buy="' + it.id + '" ' + (soldOut || poor || wait ? 'disabled' : '') + '>' +
          (soldOut ? "품절" : wait ? "확인 중" : poor ? "포인트 부족" : instant ? "구매하기" : "구매 신청") + '</button></div>';
      }).join("") + '</div>';
    }
  }

  if (S.studentPage === "activity") html += studentActivityHtml(me);
  if (S.studentPage === "stocks") html += studentStocksHtml(me);
  if (S.studentPage === "tt") html += timetableHtml(true);

  html += '</div></div>';
  return html;
}

/* ══════════ 학생 모드 — 주식 ══════════ */
function studentStocksHtml(me) {
  const d = S.data;
  const stocks = d.stocks;
  const open = d.market.open;
  const a = stockAssetOf(me);
  const cls = a.gain > 0 ? "bs-up" : a.gain < 0 ? "bs-down" : "bs-flat";
  const sign = a.gain > 0 ? "+" : "";
  const rate = a.cost > 0 ? sign + ((a.gain / a.cost) * 100).toFixed(1) + "%" : "0.0%";

  let html = '<div class="bs-card bs-card-pad mb-4">' +
    '<div class="flex items-center justify-between gap-2 flex-wrap">' +
      '<div style="font-size:13.5px;color:var(--dim);">내 주식 자산</div>' +
      '<span class="bs-mkt"><i class="bs-dot" style="background:' + (open ? "var(--green)" : "var(--mute)") + ';"></i>' +
        (open ? "거래 열림" : "거래 마감") + '</span>' +
    '</div>' +
    '<div class="bs-num" style="font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:4px;">' + fmt(a.val) +
      ' <span style="font-size:14px;font-weight:500;color:var(--dim);">' + escapeHtml(d.currency) + '</span></div>' +
    '<div class="mt-3" style="font-size:14px;">' +
      '<div class="flex justify-between py-1"><span style="color:var(--dim);">투자한 돈</span>' +
        '<span class="bs-num" style="font-weight:700;">' + fmt(a.cost) + '</span></div>' +
      '<div class="flex justify-between py-1"><span style="color:var(--dim);">평가 손익</span>' +
        '<span class="bs-num ' + cls + '" style="font-weight:700;">' + sign + fmt(a.gain) + ' (' + rate + ')</span></div>' +
    '</div></div>';

  if (!stocks.length) return html + Empty("아직 살 수 있는 주식이 없어요.");

  html += '<div class="grid gap-3">';
  stocks.forEach((st) => {
    const have = sharesOf(me, st.id);
    const h = me.holdings && me.holdings[st.id];
    const canBuy = open && st.price > 0 && me.balance >= st.price;
    const canSell = open && have > 0;
    let mine = "";
    if (h) {
      const myVal = st.price * h.shares;
      const myCost = h.avgCost * h.shares;
      const g = Math.round(myVal - myCost);
      const gc = g > 0 ? "bs-up" : g < 0 ? "bs-down" : "bs-flat";
      const gs = g > 0 ? "+" : "";
      mine = '<div class="mt-3 pt-3" style="border-top:1px solid var(--line);font-size:13.5px;">' +
        '<div class="flex justify-between py-1"><span style="color:var(--dim);">내 보유</span>' +
          '<span class="bs-num" style="font-weight:700;">' + fmt(h.shares) + '주 · 평균 ' + fmt(Math.round(h.avgCost)) + '</span></div>' +
        '<div class="flex justify-between py-1"><span style="color:var(--dim);">평가 손익</span>' +
          '<span class="bs-num ' + gc + '" style="font-weight:700;">' + gs + fmt(g) + '</span></div></div>';
    }
    html += '<div class="bs-card bs-card-pad">' +
      '<div class="flex items-center justify-between gap-3 flex-wrap">' +
        '<div style="min-width:120px;">' +
          '<div style="font-weight:700;font-size:16px;">' + escapeHtml(st.name) + '</div>' +
          (st.code ? '<div class="bs-tick-code">' + escapeHtml(st.code) + '</div>' : '') +
          (st.note ? '<div style="font-size:12.5px;color:var(--dim);margin-top:3px;">' + escapeHtml(st.note) + '</div>' : '') +
        '</div>' +
        sparkline(st.history, 90, 38) +
        '<div style="text-align:right;">' +
          '<div class="bs-num bs-price">' + fmt(st.price) + '</div>' +
          '<div class="mt-1">' + changeBadge(st) + '</div>' +
        '</div>' +
      '</div>' +
      mine +
      '<div class="flex gap-2 mt-3">' +
        '<button type="button" class="bs-btn" style="flex:1;" data-trade-buy="' + st.id + '" ' + (canBuy ? '' : 'disabled') + '>' +
          (!open ? "거래 마감" : st.price <= 0 ? "거래 불가" : me.balance < st.price ? "돈 부족" : "사기") + '</button>' +
        '<button type="button" class="bs-btn bs-btn-2" style="flex:1;" data-trade-sell="' + st.id + '" ' + (canSell ? '' : 'disabled') + '>팔기</button>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

function studentActivityKindRows(me) {
  const kind = S.studentActivityKind || "all";
  return S.data.log.filter((e) => e.studentId === me.id && (kind === "all" || e.kind === kind));
